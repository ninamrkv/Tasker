<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasker — Personal Planning</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233B82F6'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-family='-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif' font-weight='700' font-size='22' fill='white' stroke='%23000' stroke-width='0.6' paint-order='stroke'%3ET%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f4f6;height:100vh;overflow:hidden}
:root{--sb-w:210px;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;--gray-600:#4b5563;--gray-700:#374151;--gray-900:#111827;--blue:#3B82F6;--red:#E24B4A}
.shell{display:flex;height:100vh;overflow:hidden;background:#fff}
.sb{width:var(--sb-w);flex-shrink:0;background:var(--gray-100);border-right:1px solid var(--gray-200);display:flex;flex-direction:column;overflow:hidden;transition:width .2s ease,opacity .15s ease}
.sb.closed{width:0;opacity:0;border-right:none}
.sb-top{padding:12px 14px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;flex-shrink:0}
.sb-appname{font-size:13px;font-weight:600;color:var(--gray-900);white-space:nowrap}
.sb-scroll{flex:1;overflow-y:auto;padding:8px 8px 0}
.sb-sec-label{font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.07em;padding:10px 6px 4px;white-space:nowrap}
.sb-item{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--gray-600);white-space:nowrap;user-select:none}
.sb-item:hover{background:#e9eaec}
.sb-item.active{background:#fff;color:var(--gray-900);font-weight:500}
.sb-item i{font-size:14px;flex-shrink:0}
.sb-ws-emoji{font-size:13px;flex-shrink:0}
.sb-bottom{padding:10px;border-top:1px solid var(--gray-200);flex-shrink:0}
.sb-user{display:flex;align-items:center;gap:8px;padding:4px;border-radius:6px;cursor:pointer}
.sb-user:hover{background:#e9eaec}
.sb-avatar{font-size:20px;flex-shrink:0;cursor:pointer;line-height:1;user-select:none;transition:transform .1s}
.sb-avatar:hover{transform:scale(1.15)}
.sb-uname{font-size:12px;color:var(--gray-900);white-space:nowrap}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:#fff}
.topbar{padding:0 16px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;flex-shrink:0;gap:2px}
.toggle-sb{background:none;border:none;cursor:pointer;padding:10px 8px 10px 0;color:var(--gray-400);display:flex;align-items:center;flex-shrink:0}
.toggle-sb:hover{color:var(--gray-700)}
.toggle-sb i{font-size:16px}
.tabs{display:flex;align-items:flex-end;flex:1;overflow:hidden}
.tab{padding:10px 12px;font-size:12px;color:var(--gray-400);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px;user-select:none}
.tab i{font-size:12px}
.tab.active{color:var(--gray-900);border-bottom-color:var(--gray-900);font-weight:500}
.tab-actions{margin-left:auto;display:flex;align-items:center;gap:6px;padding:0 4px}
.btn-sm{background:none;border:1px solid var(--gray-200);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--gray-600);cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
.btn-sm:hover{background:var(--gray-100);border-color:var(--gray-300)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:#2563eb;border-color:#2563eb}
.content{flex:1;overflow-y:auto}
.page-pad{padding:20px 24px}
.page-title{font-size:22px;font-weight:600;color:var(--gray-900);margin-bottom:2px}
.page-sub{font-size:12px;color:var(--gray-400)}
.week-bar{display:flex;align-items:center;gap:8px;padding:8px 24px 10px}
.nav-btn{background:none;border:1px solid var(--gray-200);border-radius:6px;padding:3px 9px;font-size:11px;color:var(--gray-600);cursor:pointer}
.nav-btn:hover{background:var(--gray-100)}
.week-label{font-size:12px;color:var(--gray-600);font-weight:500}
.cal-wrap{margin:0 24px 24px;border:1px solid var(--gray-200);border-radius:10px;overflow:hidden}
.cal-grid{display:grid}
.day-col{border-right:1px solid var(--gray-200);display:flex;flex-direction:column;min-width:0;grid-row:3}
.day-hdr{padding:8px 8px 8px;border-bottom:1px solid var(--gray-200);border-right:1px solid var(--gray-200);display:flex;flex-direction:column;gap:2px;background:#fff;position:relative;grid-row:1;min-height:72px}
.day-hdr.today-hdr{background:#fef2f2}
.day-vac-row{grid-row:2;display:flex;flex-direction:column;gap:2px;min-height:0;background:#fff}
.d-name{font-size:9px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.06em}
.d-name.today-label{color:var(--red);font-weight:600}
.d-num{font-size:13px;font-weight:500;color:var(--gray-600);line-height:1}
.d-num.today-circle{color:#fff!important;background:var(--red);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.d-weather{font-size:9px;color:var(--gray-400);display:flex;align-items:center;gap:2px;white-space:nowrap}
.d-weather.today-w{color:var(--gray-600)}
.d-reminders{display:flex;flex-direction:column;gap:1px}
.d-vac-bar{height:16px;font-size:8px;color:#3b82f6;line-height:16px;padding:0 5px;white-space:nowrap;overflow:hidden;background:#fff;border-top:1.5px solid #93c5fd;border-bottom:1.5px solid #93c5fd;cursor:default;flex-shrink:0;margin:0}
.d-vac-bar.vac-first{border-left:1.5px solid #93c5fd;border-radius:4px 0 0 4px;margin-left:5px}
.d-vac-bar.vac-last{border-right:1.5px solid #93c5fd;border-radius:0 4px 4px 0;margin-right:5px}
.d-vac-bar.vac-solo{border:1.5px solid #93c5fd;border-radius:4px;margin:0 5px}
.d-reminder{font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.d-reminder.bday{color:#be185d}
.d-reminder.holiday{color:#0369a1}
.d-reminder.custom{color:var(--gray-600)}
.day-tasks{padding:4px;display:flex;flex-direction:column;gap:3px;background:var(--gray-50);flex:1;overflow-y:auto;min-height:120px}
.tc{background:#fff;border:1px solid var(--gray-200);border-left-width:3px;border-radius:5px;padding:4px 6px 4px 5px;cursor:grab;flex-shrink:0;display:flex;align-items:flex-start;gap:4px;transition:background .1s,opacity .15s;position:relative}
.tc:hover{background:var(--gray-50)}
.tc.dragging{opacity:.35;cursor:grabbing}
.day-tasks.drag-over{background:rgba(59,130,246,.06);outline:2px dashed var(--blue);outline-offset:-3px}
.tc-cb{width:11px;height:11px;border-radius:3px;border:1px solid var(--gray-300);flex-shrink:0;margin-top:2px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s}
.tc:hover .tc-cb{border-color:var(--gray-400)}
.tc-cb.done-cb{background:var(--gray-400);border-color:var(--gray-400)}
.tc-cb.done-cb::after{content:'';width:6px;height:3.5px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block}
.tc-body{flex:1;min-width:0}
.tc-dir{font-size:9px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.tc-name{font-size:10.5px;color:var(--gray-900);line-height:1.35}
.tc-meta{display:flex;align-items:center;gap:3px;margin-top:3px}
.tc-deadline{font-size:8.5px;color:var(--gray-400)}
.tc-deadline.overdue{color:#dc2626}
.tc-assignee{position:absolute;top:5px;right:5px;width:15px;height:15px;border-radius:50%;color:#fff;font-size:7.5px;font-weight:700;display:flex;align-items:center;justify-content:center;text-transform:uppercase;flex-shrink:0;cursor:default;user-select:none}
.tc.is-done{opacity:.35}
.tc.is-done .tc-name{text-decoration:line-through}
.tc.rolled .tc-dir::before{content:'↩ '}
.tc.drop-above{border-top:2px solid var(--blue)!important}
.tc.drop-below{border-bottom:2px solid var(--blue)!important}
.add-task-row{height:20px;flex-shrink:0;background:var(--gray-50);display:flex;align-items:center;padding:0 5px;border-top:1px solid var(--gray-200)}
.add-task-btn{background:none;border:none;cursor:pointer;color:transparent;font-size:11px;display:flex;align-items:center;justify-content:center;width:18px;height:16px;border-radius:3px;transition:color .1s,background .1s;padding:0}
.day-col:hover .add-task-btn{color:var(--gray-300)}
.add-task-btn:hover{background:var(--gray-200)!important;color:var(--gray-600)!important}
.section-title{font-size:13px;font-weight:500;color:var(--gray-700);display:flex;align-items:center;gap:6px;margin-bottom:12px}
.section-title i{font-size:14px;color:var(--gray-400)}
.lists-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.list-card{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:12px}
.list-card-title{font-size:12px;font-weight:500;color:var(--gray-700);margin-bottom:8px;display:flex;align-items:center;gap:5px;cursor:pointer}
.list-card-title:hover{color:var(--gray-900)}
.list-item{display:flex;align-items:flex-start;gap:7px;padding:3px 0}
.li-cb{width:13px;height:13px;border-radius:3px;border:1px solid var(--gray-300);flex-shrink:0;margin-top:1px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.li-cb.li-done{background:var(--blue);border-color:var(--blue)}
.li-cb.li-done::after{content:'';width:7px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block}
.li-text{font-size:11px;color:var(--gray-700);line-height:1.5;flex:1;min-width:0;outline:none}
.li-text.li-done-text{text-decoration:line-through;color:var(--gray-400)}
.li-heading-text{font-size:11.5px;font-weight:600;color:var(--gray-800) !important;letter-spacing:.01em}
.li-type-btn{opacity:0;background:none;border:none;cursor:pointer;color:var(--gray-300);font-size:9px;padding:0 1px;flex-shrink:0;line-height:1;transition:opacity .1s,color .1s;margin-top:2px}
.list-item:hover .li-type-btn{opacity:1}
.li-type-btn:hover{color:var(--gray-600) !important}
.li-add{font-size:11px;color:var(--gray-400);padding:3px 0;cursor:pointer;display:flex;align-items:center;gap:4px}
.li-add:hover{color:var(--gray-600)}
.add-list-btn{border:1px dashed var(--gray-300);border-radius:8px;padding:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--gray-400);cursor:pointer;min-height:60px}
.add-list-btn:hover{background:var(--gray-50);border-color:var(--gray-400);color:var(--gray-600)}
.board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:0 24px 24px}
.board-col{background:var(--gray-50);border-radius:8px;border:1px solid var(--gray-200);overflow:hidden}
.board-col-hdr{padding:10px 12px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--gray-200)}
.board-col-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.board-col-name{font-size:12px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-col-count{font-size:10px;color:var(--gray-400)}
.board-cards{padding:6px;display:flex;flex-direction:column;gap:4px;min-height:60px}
.board-add{padding:4px 8px 8px}
.board-add-btn{background:none;border:none;font-size:10px;color:var(--gray-400);cursor:pointer;display:flex;align-items:center;gap:3px;padding:3px 4px;border-radius:4px;width:100%}
.board-add-btn:hover{background:var(--gray-200);color:var(--gray-600)}
.task-table{width:100%;border-collapse:collapse}
.task-table th{font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.06em;padding:6px 12px;border-bottom:1px solid var(--gray-200);text-align:left;font-weight:500}
.task-table td{padding:7px 12px;border-bottom:1px solid var(--gray-100);font-size:12px;color:var(--gray-700);vertical-align:middle}
.task-table tr:hover td{background:var(--gray-50)}
.tt-dir-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;background:#f1f5f9}
.tt-status{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500}
.tt-todo{background:#f8fafc;color:var(--gray-600)}
.empty-state{text-align:center;padding:48px 24px;color:var(--gray-400)}
.empty-state i{font-size:36px;margin-bottom:8px;display:block}
.empty-state p{font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.overlay.hidden{display:none}
.popup{background:#fff;border-radius:12px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.popup-hdr{padding:12px 14px 0;display:flex;justify-content:flex-end}
.popup-close{background:none;border:1px solid var(--gray-200);border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--gray-600)}
.popup-close:hover{background:var(--gray-100)}
.popup-body{padding:10px 18px 20px}
.popup-title-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.popup-emoji-btn{font-size:22px;cursor:pointer;background:none;border:none;padding:0;line-height:1;transition:transform .1s}
.popup-emoji-btn:hover{transform:scale(1.15)}
.popup-name-input{flex:1;font-size:18px;font-weight:600;color:var(--gray-900);border:none;outline:none;background:transparent;min-width:0}
.popup-name-input::placeholder{color:var(--gray-300)}
.popup-props{border-top:1px solid var(--gray-100)}
.prop-row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid var(--gray-100)}
.prop-row:last-child{border-bottom:none}
.prop-label{font-size:11px;color:var(--gray-400);width:110px;flex-shrink:0;display:flex;align-items:center;gap:5px}
.prop-label i{font-size:13px}
.prop-val{flex:1;font-size:12px;color:var(--gray-700);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prop-val select,.prop-val input[type=text],.prop-val input[type=date]{background:none;border:none;outline:none;font-size:12px;color:var(--gray-700);font-family:inherit;cursor:pointer;max-width:200px}
.popup-notes-label{font-size:11px;color:var(--gray-400);margin-top:12px;margin-bottom:4px}
.popup-notes{width:100%;border:1px solid var(--gray-200);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--gray-700);resize:vertical;min-height:60px;font-family:inherit;outline:none}
.popup-notes:focus{border-color:var(--blue)}
.popup-actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.btn-danger{background:none;border:1px solid #fca5a5;border-radius:6px;padding:5px 12px;font-size:11px;color:#dc2626;cursor:pointer}
.btn-danger:hover{background:#fef2f2}
.btn-save{background:var(--blue);border:none;border-radius:6px;padding:6px 16px;font-size:12px;color:#fff;cursor:pointer;font-weight:500}
.btn-save:hover{background:#2563eb}
.priority-dots{display:flex;align-items:center;gap:6px}
.p-dot{width:12px;height:12px;border-radius:50%;cursor:pointer;opacity:.35;transition:opacity .1s,transform .1s}
.p-dot.selected{opacity:1;transform:scale(1.15)}
.p-dot:hover{opacity:.7}
.p-dot-high{background:#ef4444}
.p-dot-med{background:#eab308}
.p-dot-low{background:#22c55e}
.p-dot-none{background:var(--gray-300)}
.quick-add{background:#fff;border-radius:10px;width:100%;max-width:440px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.qa-title{font-size:14px;font-weight:500;color:var(--gray-900);margin-bottom:14px}
.qa-input{width:100%;border:1px solid var(--gray-200);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--gray-900);outline:none;font-family:inherit;margin-bottom:10px}
.qa-input:focus{border-color:var(--blue)}
.qa-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qa-select{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:5px;padding:4px 8px;font-size:11px;color:var(--gray-700);outline:none;font-family:inherit;cursor:pointer}
.qa-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.btn-cancel{background:none;border:1px solid var(--gray-200);border-radius:6px;padding:5px 14px;font-size:12px;color:var(--gray-600);cursor:pointer}
.btn-cancel:hover{background:var(--gray-100)}
.rem-panel{background:#fff;border-radius:10px;width:100%;max-width:480px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.rem-list{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto;margin-bottom:12px}
.rem-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--gray-200);border-radius:6px;font-size:12px}
.rem-item-emoji{font-size:14px}
.rem-item-text{flex:1;color:var(--gray-700)}
.rem-item-date{font-size:10px;color:var(--gray-400)}
.rem-item-del{background:none;border:none;cursor:pointer;color:var(--gray-300);font-size:13px;padding:2px}
.rem-item-del:hover{color:#dc2626}
.rem-add-form{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--gray-200)}
.rem-add-row{display:flex;gap:8px}
.rem-input{flex:1;border:1px solid var(--gray-200);border-radius:6px;padding:6px 10px;font-size:12px;outline:none;font-family:inherit}
.rem-input:focus{border-color:var(--blue)}
.bulk-textarea{width:100%;border:1px solid var(--gray-200);border-radius:6px;padding:7px 10px;font-size:11px;height:64px;resize:none;outline:none;font-family:monospace}
.bulk-textarea:focus{border-color:var(--blue)}
.dir-settings{background:#fff;border-radius:10px;width:100%;max-width:480px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.15);max-height:85vh;overflow-y:auto}
.dir-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--gray-200);border-radius:7px;margin-bottom:6px}
.dir-color-btn{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:transform .1s}
.dir-color-btn:hover{transform:scale(1.15)}
.dir-name-input{flex:1;border:none;outline:none;font-size:12px;color:var(--gray-900);font-family:inherit;background:transparent}
.dir-emoji-btn{font-size:16px;cursor:pointer;background:none;border:none;padding:0;flex-shrink:0}
.dir-del-btn{background:none;border:none;cursor:pointer;color:var(--gray-300);font-size:13px}
.dir-del-btn:hover{color:#dc2626}
.color-picker-row{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0}
.color-swatch{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.color-swatch:hover,.color-swatch.sel{transform:scale(1.2);border-color:var(--gray-400)}
.emoji-picker{background:#fff;border-radius:10px;width:100%;max-width:340px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.emoji-grid{display:flex;flex-wrap:wrap;gap:2px;margin:10px 0}
.emoji-btn{font-size:20px;background:none;border:none;cursor:pointer;padding:4px 5px;border-radius:5px;line-height:1}
.emoji-btn:hover{background:var(--gray-100)}
.mini-modal{background:#fff;border-radius:10px;width:100%;max-width:340px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.mm-field{margin-bottom:10px}
.mm-label{font-size:11px;color:var(--gray-400);margin-bottom:4px}
.mm-input{width:100%;border:1px solid var(--gray-200);border-radius:6px;padding:7px 10px;font-size:13px;outline:none;font-family:inherit}
.mm-input:focus{border-color:var(--blue)}
.notif-toast{position:fixed;bottom:24px;right:24px;background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;z-index:9999;pointer-events:none;transition:opacity .2s}
.recur-choice-btn{border:1px solid var(--gray-200);border-radius:8px;padding:10px 13px;cursor:pointer;transition:background .12s,border-color .12s;margin-bottom:0}

<script>
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
const isoDate=d=>d.toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return isoDate(x);};
const dayOfWeek=d=>new Date(d+'T12:00:00').getDay();
const DAY_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function getWeekDates(offset=0){
  const now=new Date(),dow=now.getDay(),monday=new Date(now);
  monday.setDate(now.getDate()-(dow===0?6:dow-1)+offset*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return isoDate(d);});
}

const DEFAULT_DIRECTIONS=[
  {id:'drr',  name:'UNICEF: DRR',       color:'#3B82F6',emoji:'🔵',category:'work'},
  {id:'wash', name:'UNICEF: WASH',      color:'#22C55E',emoji:'💧',category:'work'},
  {id:'nutr', name:'UNICEF: Nutrition', color:'#F97316',emoji:'🥗',category:'work'},
  {id:'rep',  name:'UNICEF: Reporting', color:'#A855F7',emoji:'📊',category:'work'},
  {id:'nalyv',name:'Bilyi Nalyv',       color:'#EC4899',emoji:'🌿',category:'work'},
  {id:'eng',  name:'English',           color:'#EAB308',emoji:'📖',category:'personal'},
  {id:'food', name:'Food',              color:'#F97316',emoji:'🛒',category:'personal'},
  {id:'gym',  name:'Gym',               color:'#EF4444',emoji:'🏋️',category:'personal'},
  {id:'clean',name:'Cleaning',          color:'#6B7280',emoji:'🧹',category:'personal'},
  {id:'laund',name:'Laundry',           color:'#9CA3AF',emoji:'🧺',category:'personal'},
  {id:'trav', name:'Travel',            color:'#0EA5E9',emoji:'✈️', category:'personal'},
];

let state={
  workspaces:[{id:'ws1',name:'Planning',emoji:'📅'}],
  activeWs:'ws1',activeTab:'weekly',sidebarOpen:true,weekOffset:0,
  directions:DEFAULT_DIRECTIONS,tasks:[],reminders:[],lists:[],
  wsNotes:{},
  userName:'nina',userEmoji:'👤',weather:{},userCity:null,
};

function save(){
  ['workspaces','activeWs','directions','tasks','reminders','lists','wsNotes','userName','userEmoji','weekOffset']
    .forEach(k=>localStorage.setItem('tasker_'+k,JSON.stringify(state[k])));
  localStorage.setItem('tasker_ts',Date.now());
  syncPush();
}
function load(){
  ['workspaces','activeWs','directions','tasks','reminders','lists','wsNotes','userName','userEmoji','weekOffset']
    .forEach(k=>{const v=localStorage.getItem('tasker_'+k);if(v!=null)try{state[k]=JSON.parse(v);}catch(e){}});
  if(!state.wsNotes)state.wsNotes={};
  // Keep only one workspace
  if(state.workspaces.length>1){
    const active=state.workspaces.find(w=>w.id===state.activeWs)||state.workspaces[0];
    state.workspaces=[active];state.activeWs=active.id;
  }
  if(!state.workspaces.length) state.workspaces=[{id:'ws1',name:'Planning',emoji:'📅'}];
  state.weekOffset=state.weekOffset||0;
  // Reset if showing a fully past week
  if(getWeekDates(state.weekOffset)[6]<today()) state.weekOffset=0;
  if(!state.userEmoji) state.userEmoji='👤';
  // Lowercase migration
  if(state.userName==='Nina') state.userName='nina';
}

function cleanupArchive(){
  const cutoff=addDays(today(),-30),before=state.tasks.length;
  state.tasks=state.tasks.filter(t=>!(t.status==='done'&&t.archivedOn&&t.archivedOn<cutoff));
  if(state.tasks.length!==before)save();
}

// ── RECURRENCE HELPERS ────────────────────────────────────────────────────────
function recurSelectHtml(currentVal,id){
  const groups=[
    {label:null,opts:[['','No recurrence']]},
    {label:'Daily',opts:[['daily','Every day'],['weekdays','Every weekday (Mon–Fri)']]},
    {label:'Weekly',opts:[
      ['w:1','Every Monday'],['w:2','Every Tuesday'],['w:3','Every Wednesday'],
      ['w:4','Every Thursday'],['w:5','Every Friday'],['w:6','Every Saturday'],['w:0','Every Sunday'],
    ]},
    {label:'Multiple days',opts:[
      ['w:1,4','Mon & Thu'],['w:1,3','Mon & Wed'],['w:2,5','Tue & Fri'],
      ['w:1,2,3,4,5','Weekdays'],['w:0,6','Weekends'],
    ]},
    {label:'Every 2 weeks',opts:[
      ['bw:1','Biweekly · Mon'],['bw:2','Biweekly · Tue'],['bw:3','Biweekly · Wed'],
      ['bw:4','Biweekly · Thu'],['bw:5','Biweekly · Fri'],
    ]},
    {label:'Monthly',opts:[
      ['m:same','Same date each month'],['m:1','1st of month'],['m:5','5th'],
      ['m:10','10th'],['m:15','15th'],['m:20','20th'],['m:25','25th'],['m:last','Last day'],
    ]},
    {label:'Every N days',opts:[
      ['i:2','Every 2 days'],['i:3','Every 3 days'],['i:5','Every 5 days'],
      ['i:7','Every 7 days'],['i:10','Every 10 days'],['i:14','Every 14 days'],['i:30','Every 30 days'],
    ]},
  ];
  let html=`<select class="qa-select" id="${id}" style="flex:1">`;
  groups.forEach(g=>{
    if(!g.label){g.opts.forEach(([v,l])=>html+=`<option value="${v}"${v===currentVal?' selected':''}>${l}</option>`);}
    else{
      html+=`<optgroup label="${g.label}">`;
      g.opts.forEach(([v,l])=>html+=`<option value="${v}"${v===currentVal?' selected':''}>${l}</option>`);
      html+=`</optgroup>`;
    }
  });
  return html+'</select>';
}

function recurDaysToString(recurDays){
  if(!recurDays||!recurDays.length) return '';
  const s=[...recurDays].sort((a,b)=>a-b);
  if(JSON.stringify(s)==='[1,2,3,4,5]') return 'weekdays';
  return 'w:'+s.join(',');
}

function nextRecurrenceDate(task,fromDate){
  const r=task.recurrence||recurDaysToString(task.recurDays||[]);
  if(!r) return null;
  if(r==='daily') return addDays(fromDate,1);
  if(r==='weekdays'){
    let d=addDays(fromDate,1);for(let i=0;i<7;i++){if(![0,6].includes(dayOfWeek(d)))return d;d=addDays(d,1);}
  }
  if(r.startsWith('w:')){
    const days=r.slice(2).split(',').map(Number);
    let d=addDays(fromDate,1);for(let i=0;i<14;i++){if(days.includes(dayOfWeek(d)))return d;d=addDays(d,1);}
  }
  if(r.startsWith('bw:')){
    const wd=parseInt(r.slice(3));
    let d=addDays(fromDate,8);for(let i=0;i<7;i++){if(dayOfWeek(d)===wd)return d;d=addDays(d,1);}
  }
  if(r==='m:same'){const d=new Date(fromDate+'T12:00:00');d.setMonth(d.getMonth()+1);return isoDate(d);}
  if(r==='m:last'){const d=new Date(fromDate+'T12:00:00');d.setMonth(d.getMonth()+2,0);return isoDate(d);}
  if(r.startsWith('m:')){const md=parseInt(r.slice(2));const d=new Date(fromDate+'T12:00:00');d.setMonth(d.getMonth()+1,md);return isoDate(d);}
  if(r.startsWith('i:')){return addDays(fromDate,parseInt(r.slice(2)));}
  return null;
}

// Does a recurring task have an occurrence on a specific date?
function taskOccursOn(task,date){
  const r=task.recurrence||recurDaysToString(task.recurDays||[]);
  if(!r||!task.scheduledDate||date<task.scheduledDate) return false;
  const dow=dayOfWeek(date);
  if(r==='daily') return true;
  if(r==='weekdays') return dow>=1&&dow<=5;
  if(r.startsWith('w:')){
    const days=r.slice(2).split(',').map(Number);
    return days.includes(dow);
  }
  if(r.startsWith('bw:')){
    const wd=parseInt(r.slice(3));
    if(dow!==wd) return false;
    const diffDays=Math.round((new Date(date+'T12:00:00')-new Date(task.scheduledDate+'T12:00:00'))/86400000);
    return diffDays>=0&&Math.floor(diffDays/7)%2===0;
  }
  if(r==='m:same'){
    return new Date(date+'T12:00:00').getDate()===new Date(task.scheduledDate+'T12:00:00').getDate();
  }
  if(r==='m:last'){
    const d=new Date(date+'T12:00:00');
    return d.getDate()===new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  }
  if(r.startsWith('m:')){
    return new Date(date+'T12:00:00').getDate()===parseInt(r.slice(2));
  }
  if(r.startsWith('i:')){
    const interval=parseInt(r.slice(2));
    const diffDays=Math.round((new Date(date+'T12:00:00')-new Date(task.scheduledDate+'T12:00:00'))/86400000);
    return diffDays>=0&&diffDays%interval===0;
  }
  return false;
}

function autoRollover(){
  const td=today();let changed=false;
  state.tasks.forEach(t=>{
    if(t.status==='todo'&&t.scheduledDate&&t.scheduledDate<td){
      const next=nextRecurrenceDate(t,t.scheduledDate);
      if(next){t.scheduledDate=next;} // recurring: just move forward
      else{t.status='rolled';t.scheduledDate=findNextSlot(t.scheduledDate,t);} // one-time: rollover
      changed=true;
    }
  });
  if(changed)save();
}

function tasksOnDate(date,excludeId=null){
  return state.tasks.filter(t=>t.scheduledDate===date&&t.id!==excludeId&&t.status!=='done').length;
}
function findNextSlot(fromDate,task){
  let d=addDays(fromDate,1),safety=0;
  while(tasksOnDate(d,task.id)>=10&&safety<30){d=addDays(d,1);safety++;}
  return d;
}

async function fetchWeather(){
  try{
    const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000}));
    const{latitude:lat,longitude:lon}=pos.coords;
    const geo=await fetch(`https://wttr.in/${lat},${lon}?format=j1`).then(r=>r.json());
    state.userCity=geo.nearest_area?.[0]?.areaName?.[0]?.value||'';
    const w=geo.current_condition?.[0];
    if(w){
      const weekDates=getWeekDates(state.weekOffset);
      weekDates.forEach((d,i)=>{
        const day=geo.weather?.[Math.min(i,(geo.weather?.length||1)-1)];
        const maxC=day?.maxtempC||w.temp_C,minC=day?.mintempC||w.temp_C;
        const wcode=parseInt(day?.hourly?.[4]?.weatherCode||w.weatherCode);
        state.weather[d]={icon:wIcon(wcode),temp:`${Math.round((parseInt(maxC)+parseInt(minC))/2)}°`};
      });
    }
    render();
  }catch(e){
    try{
      const r=await fetch('https://wttr.in/?format=j1').then(x=>x.json());
      state.userCity=r.nearest_area?.[0]?.areaName?.[0]?.value||'';
      const w=r.current_condition?.[0];
      if(w){const wd=getWeekDates(state.weekOffset);wd.forEach(d=>{state.weather[d]={icon:wIcon(parseInt(w.weatherCode)),temp:`${w.temp_C}°`};});}
      render();
    }catch(e2){}
  }
}
function wIcon(c){if(c<=113)return'☀️';if(c<=116)return'🌤️';if(c<=119)return'☁️';if(c<=143)return'🌫️';if(c<=176)return'🌦️';if(c<=260)return'🌧️';if(c<=350)return'🌨️';if(c<=389)return'⛈️';return'🌨️';}

function dirById(id){

const EMOJI_LIST=['📊','📋','📁','📂','💼','📌','📍','🔖','📝','✏️','🖊️','📎','🔗','🗂️','📅','⏰','🔔','📢','💡','🔍','✅','❌','⚠️','🚨','🎯','🏆','⭐','🔥','💧','🌟','❤️','🩷','💜','💛','💚','💙','🏋️','🧘','🏃','🚴','🏊','🥗','🍎','🛒','🧹','🧺','✈️','🌍','🎬','📚','🎵','🎮','🌿','💪','🏠','🏢','💻','📱','⚙️','🔧','🛠️','🤝','💬','🎂','🗓️','👤','👥','🙌','🌈','🦋','🔵','🟢','🟡','🟠','🔴','🟣','⬜','🟤'];

// ── MINI MODAL (replaces prompt) ──────────────────────────────────────────────
function showMiniModal({title,fields,submitLabel='OK',onSubmit}){
  const fhtml=fields.map(f=>`<div class="mm-field">
    ${f.label?`<div class="mm-label">${f.label}</div>`:''}
    <input class="mm-input" id="mm-${f.id}" type="${f.type||'text'}" value="${escAttr(f.value||'')}" placeholder="${escAttr(f.placeholder||'')}">
  </div>`).join('');
  showOverlay(`<div class="mini-modal" onclick="event.stopPropagation()">
    <div class="qa-title">${title}</div>${fhtml}
    <div class="qa-actions">
      <button class="btn-cancel" onclick="closeOverlay()">Cancel</button>
      <button class="btn-save" onclick="_mmSubmit()">${submitLabel}</button>
    </div>
  </div>`);
  window._mmSubmit=()=>{
    const vals={};fields.forEach(f=>{vals[f.id]=document.getElementById(`mm-${f.id}`)?.value||'';});
    closeOverlay();onSubmit(vals);
  };
  setTimeout(()=>document.getElementById(`mm-${fields[0]?.id}`)?.focus(),50);
}

function showConfirm(message,onConfirm){
  showOverlay(`<div class="mini-modal" onclick="event.stopPropagation()">

function getNotes(wsId){if(!state.wsNotes[wsId])state.wsNotes[wsId]={html:''};return state.wsNotes[wsId];}
function getDomain(url){try{return new URL(url).hostname.replace(/^www\./,'');}catch(e){return url.slice(0,40);}}
function isUrl(s){try{return/^https?:\/\//i.test(s)&&!!new URL(s);}catch(e){return false;}}
function isEmail(s){return/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.trim());}

function getServiceIcon(url){
  try{
    const u=new URL(url),h=u.hostname,p=u.pathname;
    const G='https://ssl.gstatic.com/images/branding/product/2x/';
    if(h.includes('docs.google.com')){
      if(p.startsWith('/spreadsheets')) return G+'sheets_2020q4_48dp.png';
      if(p.startsWith('/presentation')) return G+'slides_2020q4_48dp.png';
      if(p.startsWith('/forms'))        return G+'forms_2020q4_48dp.png';
      return G+'docs_2020q4_48dp.png';
    }
    if(h.includes('drive.google.com'))    return G+'drive_2020q4_48dp.png';
    if(h.includes('mail.google.com')||h.includes('gmail.com')) return G+'gmail_2020q4_48dp.png';
    if(h.includes('calendar.google.com')) return G+'calendar_2020q4_48dp.png';
    if(h.includes('meet.google.com'))     return G+'meet_2020q4_48dp.png';
    return`https://www.google.com/s2/favicons?domain=${encodeURIComponent(h)}&sz=32`;
  }catch(e){return`https://www.google.com/s2/favicons?domain=${encodeURIComponent(getDomain(url))}&sz=32`;}
}

function makeChipHtml(url, label){
  const domain=getDomain(url);
  const display=escHtml(label&&label.trim()?label.trim():domain);
  const icon=getServiceIcon(url);
  return`<a href="${escAttr(url)}" target="_blank" rel="noopener" class="url-chip" contenteditable="false">`+
    `<img src="${icon}" onerror="this.src='https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=32'"><span>${display}</span>`+
    `<button class="chip-x" onclick="event.preventDefault();event.stopPropagation();this.closest('.url-chip').remove();saveNoteContent(currentWsId())">×</button>`+
    `</a>`;
}

function currentWsId(){return state.activeWs;}

function nfmt(cmd){document.execCommand(cmd,false,null);document.getElementById('notes-ed-'+state.activeWs)?.focus();}

function insertCheckbox(){
  document.execCommand('insertHTML',false,
    '<span contenteditable="false" style="user-select:none"><input type="checkbox" class="notes-checkbox" style="margin-right:4px;cursor:pointer;accent-color:#3B82F6" onclick="saveNoteContent(\''+state.activeWs+'\')"></span>&#8203;');
  document.getElementById('notes-ed-'+state.activeWs)?.focus();

function addInlineLink(wsId){
  const sel=window.getSelection();
  const selectedText=sel?sel.toString().trim():'';
  // Save cursor position before modal steals focus
  const savedRange=sel&&sel.rangeCount>0?sel.getRangeAt(0).cloneRange():null;
  showMiniModal({title:'Insert link chip',fields:[
    {id:'url',placeholder:'https://...'},
    {id:'label',label:'Label',value:selectedText,placeholder:'e.g. "WASH Report"'},
  ],submitLabel:'Insert',onSubmit:vals=>{
    const url=vals.url.trim();if(!url)return;
    const fullUrl=isUrl(url)?url:'https://'+url;
    const editor=document.getElementById('notes-ed-'+wsId);
    if(editor){
      editor.focus();
      if(savedRange){
        const s=window.getSelection();s.removeAllRanges();s.addRange(savedRange);
        // Delete selected text if any
        if(selectedText){const r=s.getRangeAt(0);r.deleteContents();}
      }
    }
    document.execCommand('insertHTML',false,makeChipHtml(fullUrl,vals.label)+' ');
    saveNoteContent(wsId);
  }});
}

function insertUrlChipFromBtn(wsId){
  const sel=window.getSelection();
  const savedRange=sel&&sel.rangeCount>0?sel.getRangeAt(0).cloneRange():null;
  showMiniModal({title:'Insert link chip',fields:[
    {id:'url',placeholder:'https://docs.google.com/...'},
    {id:'label',label:'Name (shown on chip)',placeholder:'e.g. "WASH Report Q2"'},
  ],submitLabel:'Insert',onSubmit:vals=>{
    const url=vals.url.trim();if(!url)return;
    const fullUrl=isUrl(url)?url:'https://'+url;
    const editor=document.getElementById('notes-ed-'+wsId);
    if(editor){
      editor.focus();
      if(savedRange){const s=window.getSelection();s.removeAllRanges();s.addRange(savedRange);}
    }
    document.execCommand('insertHTML',false,makeChipHtml(fullUrl,vals.label)+' ');
    saveNoteContent(wsId);
  }});
}

function saveNoteContent(wsId){
  const el=document.getElementById('notes-ed-'+wsId);
  if(!el)return;
  getNotes(wsId).html=el.innerHTML;save();
}

// Auto-detect paste: URLs → chip, emails → mailto link
function setupNotesEditor(wsId){
  const el=document.getElementById('notes-ed-'+wsId);
  if(!el)return;
  el.addEventListener('paste',e=>{
    const text=(e.clipboardData||window.clipboardData).getData('text/plain').trim();
    if(isUrl(text)){
      e.preventDefault();
      // Insert as plain blue link inline (use 📎 button for chips)
      const display=text.length>70?text.slice(0,70)+'…':text;
      document.execCommand('insertHTML',false,`<a href="${text}" target="_blank" rel="noopener">${display}</a>`);
      saveNoteContent(wsId);
    } else if(isEmail(text)){
      e.preventDefault();
      document.execCommand('insertHTML',false,`<a href="mailto:${text}">${text}</a>`);
      saveNoteContent(wsId);
    } else {
      e.preventDefault();
      const plain=(e.clipboardData||window.clipboardData).getData('text/plain');
      document.execCommand('insertText',false,plain);
    }
  });
}

// ── WEEKLY VIEW ───────────────────────────────────────────────────────────────
let _mobileDayIdx=null;
function setMobileDay(i){_mobileDayIdx=i;renderWeekly();}
function renderWeekly(){
  if(window.innerWidth<768){renderMobileWeekly();return;}
  const ws=state.workspaces.find(w=>w.id===state.activeWs)||state.workspaces[0];
  const dates=getWeekDates(state.weekOffset),td=today();
  const todayIdx=dates.indexOf(td);
  const cols=dates.map((_,i)=>i===todayIdx&&todayIdx>=0?'1.35fr':'.7fr').join(' ');
  let html=`<div class="page-pad" style="padding-bottom:8px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px">
    <div class="page-title" contenteditable="true" onblur="renameWs(this.textContent)">${ws.name}</div>
    <div class="clock-widget" id="clock-widget">
      <div class="clock-entry">
        <span class="clock-time" id="clk-ua">--:--</span>
        <span class="clock-tz">Kyiv</span>
      </div>
      <div class="clock-entry">
        <span class="clock-time" id="clk-local">--:--</span>
        <span class="clock-tz" id="clk-local-lbl">${state.userCity||'Local'}</span>
      </div>
    </div>
  </div>
  <div class="week-bar">
    <button class="nav-btn" onclick="changeWeek(-1)">‹</button>
    <button class="nav-btn" onclick="changeWeek(0)">Today</button>
    <button class="nav-btn" onclick="changeWeek(1)">›</button>
    <span class="week-label">${fmt(dates[0])} – ${fmt(dates[6])}</span>
  </div>
  <div class="cal-wrap"><div class="cal-grid" style="grid-template-columns:${cols}">`;

  // ── Three-pass render: headers (row 1), vacation bars (row 2), task cols (row 3)
  // Row 2 has no borders between cells so vacation bars connect seamlessly.
  let hdrHtml='',vacHtml='',colHtml='';
  dates.forEach((date,idx)=>{
    const isToday=date===td,dow=dayOfWeek(date);
    const w=state.weather[date],rems=state.reminders.filter(r=>remMatchesDate(r,date));
    const vacRems=rems.filter(r=>r.type==='vacation');
    const nonVacRems=rems.filter(r=>r.type!=='vacation');
    // Vacation bars go in their own grid row (row 2) so they span columns without being cut by borders
    const vacBars=vacRems.map(v=>{
      const s=v.startDate||v.date,e=v.endDate||v.date;
      const isFirst=date===s||(date===dates[0]&&s<dates[0]);
      const isLast=date===e||(date===dates[6]&&e>dates[6]);
      const cls=isFirst&&isLast?'vac-solo':isFirst?'vac-first':isLast?'vac-last':'';
      const showLabel=date===s||(date===dates[0]&&s<dates[0]);
      return`<div class="d-vac-bar ${cls}">${showLabel?escHtml(v.text):''}</div>`;
    }).join('');
    const noRightBorder=idx===6?'border-right:none':'';
    hdrHtml+=`<div class="day-hdr ${isToday?'today-hdr':''}" style="${noRightBorder}">
      <div class="d-name ${isToday?'today-label':''}">${isToday?'Today · ':''}${DAY_NAMES[dow]}</div>
      <div class="d-num ${isToday?'today-circle':''}">${date.slice(8)}</div>
      <div class="d-weather ${isToday?'today-w':''}">${w?`${w.icon} ${w.temp}${isToday&&state.userCity?' · '+state.userCity:''}`:''}</div>
      <div class="d-reminders">${nonVacRems.map(r=>`<div class="d-reminder ${r.type}" title="${r.text}">${r.emoji||'📌'} ${r.text}</div>`).join('')}</div>
    </div>`;
    // Row 2: vacation bar cells — NO border-right between them so bars connect seamlessly
    vacHtml+=`<div class="day-vac-row"${vacBars?' style="padding:3px 0 2px"':''}>${vacBars}</div>`;
    const tasks=state.tasks.filter(t=>{
      if(t.workspaceId!==state.activeWs) return false;
      // Done/rolled tasks: only on their actual scheduled date
      if(t.status==='done'||t.status==='rolled') return t.scheduledDate===date;
      // Directly scheduled
      if(t.scheduledDate===date) return true;
      // Virtual recurring occurrence: show on all matching future days
      const r=t.recurrence||recurDaysToString(t.recurDays||[]);
      if(!r||!t.scheduledDate||t.scheduledDate>date) return false;
      return taskOccursOn(t,date);
    }).sort((a,b)=>{
      // Tasks without a manual sortOrder from pinned directions always go first
      const aPinnedIdx=a.sortOrder==null?PINNED_DIR_ORDER.indexOf(dirById(a.directionId)?.name??''):-1;
      const bPinnedIdx=b.sortOrder==null?PINNED_DIR_ORDER.indexOf(dirById(b.directionId)?.name??''):-1;
      if(aPinnedIdx>=0&&bPinnedIdx>=0) return aPinnedIdx-bPinnedIdx;
      if(aPinnedIdx>=0) return -1;
      if(bPinnedIdx>=0) return 1;
      // Normal sort: manual order then priority
      const ao=a.sortOrder??Infinity,bo=b.sortOrder??Infinity;
      if(ao!==bo)return ao-bo;
      const p={urgent:0,high:1,medium:2,low:3};
      return(p[a.type==='urgent'?'urgent':a.priority]||4)-(p[b.type==='urgent'?'urgent':b.priority]||4);
    });
    colHtml+=`<div class="day-col" id="dc-${date}" style="${noRightBorder}">
      <div class="day-tasks" ondragover="taskDragOver(event,'${date}')" ondragleave="taskDragLeave(event)" ondrop="taskDrop(event,'${date}')">${tasks.map(t=>renderTaskCard(t)).join('')}</div>
      <div class="add-task-row">
        <button class="add-task-btn" onclick="openAddTask('${date}')" title="Add task"><i class="ti ti-plus" style="font-size:10px"></i></button>
      </div>
    </div>`;
  });
  html+=hdrHtml+vacHtml+colHtml+`</div></div>`;

  const lists=state.lists.filter(l=>l.workspaceId===state.activeWs);
  html+=`<div class="below-cal-grid">
    <div class="below-col">
      <div class="section-title" style="margin-bottom:10px"><i class="ti ti-layout-grid"></i> Lists</div>
      <div class="lists-grid-v">
        ${lists.map(l=>renderListCard(l)).join('')}
        <div class="add-list-btn" onclick="addList()"><i class="ti ti-plus" style="font-size:14px"></i> New list</div>
      </div>
    </div>
    <div class="below-col">${renderNotesSection(state.activeWs)}</div>
  </div>`;
  document.getElementById('content').innerHTML=html;
  setTimeout(()=>{setupNotesEditor(state.activeWs);startClock();},0);
}

const PINNED_DIR_ORDER=['Cleaning','Food','Gym','English','Other'];
const ASSIGNEE_COLORS=['#6366f1','#3b82f6','#22c55e','#f97316','#a855f7','#ec4899','#14b8a6','#f59e0b','#ef4444','#0ea5e9'];
function assigneeColor(name){return ASSIGNEE_COLORS[(name.toUpperCase().charCodeAt(0)||65)%ASSIGNEE_COLORS.length];}

function renderTaskCard(t){
  const dir=dirById(t.directionId),isDone=t.status==='done',isRolled=t.status==='rolled';
  const dl=t.deadline&&t.deadline<today()&&!isDone
    ?`<span class="tc-deadline overdue">${fmt(t.deadline)}</span>`
    :t.deadline?`<span class="tc-deadline">${fmt(t.deadline)}</span>`:'';
  const avatar=t.assignee
    ?`<div class="tc-assignee" style="background:${assigneeColor(t.assignee)}" title="${escHtml(t.assignee)}">${escHtml(t.assignee.trim()[0].toUpperCase())}</div>`
    :'';

// ── LISTS ─────────────────────────────────────────────────────────────────────
function renderListItem(listId, item){
  const isH=item.type==='heading';
  if(isH){
    return`<div class="list-item" id="li-${item.id}" style="padding:5px 0 1px">
      <button class="li-type-btn" onclick="toggleListItemType('${listId}','${item.id}')" title="Convert to task">☰</button>
      <span class="li-text li-heading-text" contenteditable="true"
        onblur="editListItem('${listId}','${item.id}',this.innerHTML)"
        onkeydown="liKeyDown(event,'${listId}','${item.id}')"
        onpaste="liPaste(event,'${listId}','${item.id}')"
      >${item.text||''}</span>
    </div>`;
  }
  return`<div class="list-item" id="li-${item.id}">
    <button class="li-type-btn" onclick="toggleListItemType('${listId}','${item.id}')" title="Convert to heading">T</button>
    <div class="li-cb ${item.done?'li-done':''}" onclick="toggleListItem('${listId}','${item.id}')"></div>
    <span class="li-text ${item.done?'li-done-text':''}" contenteditable="true"
      onblur="editListItem('${listId}','${item.id}',this.textContent)"
      onkeydown="liKeyDown(event,'${listId}','${item.id}')"
      onpaste="liPaste(event,'${listId}','${item.id}')"
    >${escHtml(item.text)}</span>
  </div>`;
}

function renderListCard(l){
  return`<div class="list-card" id="lc-${l.id}">
    <div class="list-card-title" onclick="renameList('${l.id}')">${l.emoji||'📝'} ${escHtml(l.title)}</div>
    <div id="li-wrap-${l.id}">${l.items.map(item=>renderListItem(l.id,item)).join('')}</div>
    <div class="li-add" onclick="addListItemInline('${l.id}',null)"><i class="ti ti-plus" style="font-size:10px"></i> Add item</div>
  </div>`;
}

function addList(){
  const l={id:uid(),title:'New list',emoji:'📝',workspaceId:state.activeWs,items:[]};
  state.lists.push(l);save();render();
  setTimeout(()=>renameList(l.id),100);
}

function renameList(id){
  const l=state.lists.find(x=>x.id===id);if(!l)return;
  showMiniModal({title:'Rename list',fields:[
    {id:'name',label:'Name',value:l.title,placeholder:'List name...'},
    {id:'emoji',label:'Emoji',value:l.emoji||'📝',placeholder:'📝'},
  ],submitLabel:'Save',onSubmit:vals=>{
    l.title=vals.name.trim()||l.title;l.emoji=vals.emoji.trim()||l.emoji;save();render();
  }});
}

function addListItemInline(listId, afterItemId){
  const l=state.lists.find(x=>x.id===listId);if(!l)return;
  const item={id:uid(),text:'',done:false};
  if(afterItemId){
    const idx=l.items.findIndex(x=>x.id===afterItemId);
    if(idx>=0)l.items.splice(idx+1,0,item);else l.items.push(item);
  }else{l.items.push(item);}
  save();
  const wrap=document.getElementById('li-wrap-'+listId);
  if(!wrap){render();return;}
  const tmp=document.createElement('div');
  tmp.innerHTML=renderListItem(listId,item);
  const itemEl=tmp.firstElementChild;
  if(afterItemId){
    const afterEl=document.getElementById('li-'+afterItemId);
    if(afterEl&&afterEl.parentNode===wrap)wrap.insertBefore(itemEl,afterEl.nextSibling);
    else wrap.appendChild(itemEl);
  }else{wrap.appendChild(itemEl);}
  const span=itemEl.querySelector('.li-text');
  if(span){span.focus();placeCaretAtEnd(span);}
}

function liKeyDown(event, listId, itemId){
  if(event.key==='Enter'){
    event.preventDefault();
    const span=event.target;
    const l=state.lists.find(x=>x.id===listId);
    const item=l?.items.find(x=>x.id===itemId);
    if(item)item.text=span.textContent.trim();
    save();
    addListItemInline(listId,itemId);
  }else if(event.key==='Backspace'){
    const span=event.target;
    if(span.textContent.trim()===''){
      event.preventDefault();
      removeListItemEl(listId,itemId);
    }
  }
}

function liPaste(event, listId, itemId){
  event.preventDefault();
  const text=(event.clipboardData||window.clipboardData).getData('text/plain');
  const lines=text.split(/\r?\n/).filter(s=>s.trim());
  if(lines.length<=1){document.execCommand('insertText',false,text);return;}
  const l=state.lists.find(x=>x.id===listId);if(!l)return;
  const span=event.target;
  const existing=span.textContent||'';
  const item=l.items.find(x=>x.id===itemId);
  if(item){item.text=(existing+lines[0]).trim();}
  span.textContent=(existing+lines[0]).trim();
  save();
  let afterId=itemId;
  for(let i=1;i<lines.length;i++){
    const newItem={id:uid(),text:lines[i].trim(),done:false};
    const idx=l.items.findIndex(x=>x.id===afterId);
    l.items.splice(idx+1,0,newItem);save();
    const wrap=document.getElementById('li-wrap-'+listId);
    if(wrap){
      const tmp=document.createElement('div');
      tmp.innerHTML=renderListItem(listId,newItem);
      const itemEl=tmp.firstElementChild;
      const afterEl=document.getElementById('li-'+afterId);
      if(afterEl&&afterEl.parentNode===wrap)wrap.insertBefore(itemEl,afterEl.nextSibling);
      else wrap.appendChild(itemEl);
    }
    afterId=newItem.id;
  }
}

function removeListItemEl(listId, itemId){
  const l=state.lists.find(x=>x.id===listId);if(!l)return;
  const idx=l.items.findIndex(x=>x.id===itemId);
  const prevItem=idx>0?l.items[idx-1]:null;
  l.items.splice(idx,1);save();
  const el=document.getElementById('li-'+itemId);
  if(el){
    if(prevItem){
      const prevSpan=document.getElementById('li-'+prevItem.id)?.querySelector('.li-text');
      if(prevSpan){prevSpan.focus();placeCaretAtEnd(prevSpan);}
    }
    el.remove();
  }
}

function placeCaretAtEnd(el){
  el.focus();
  const range=document.createRange();
  range.selectNodeContents(el);range.collapse(false);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);
}

function toggleListItem(listId,itemId){
  const l=state.lists.find(x=>x.id===listId);if(!l)return;
  const item=l.items.find(x=>x.id===itemId);if(!item)return;
  item.done=!item.done;save();render();
}

function editListItem(listId,itemId,text){
  const l=state.lists.find(x=>x.id===listId);if(!l)return;
  const item=l.items.find(x=>x.id===itemId);if(!item)return;
  item.text=item.type==='heading'?text:text.trim();save();
}

function toggleListItemType(listId,itemId){
  const l=state.lists.find(x=>x.id===listId);if(!l)return;
  const item=l.items.find(x=>x.id===itemId);if(!item)return;
  item.type=item.type==='heading'?'task':'heading';
  if(item.type==='heading')item.done=false;
  save();
  const el=document.getElementById('li-'+itemId);
  if(el){
    const tmp=document.createElement('div');
    tmp.innerHTML=renderListItem(listId,item);
    const newEl=tmp.firstElementChild;
    el.replaceWith(newEl);
    newEl.querySelector('.li-text')?.focus();
  }
}

// ── TASK ACTIONS ──────────────────────────────────────────────────────────────
function toggleDone(e,id){
  e.stopPropagation();
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  if(t.status==='done'){
    t.status='todo';t.archivedOn=null;
  } else {
    const r=t.recurrence||recurDaysToString(t.recurDays||[]);
    if(r){
      // Recurring: archive this occurrence, advance to next
      const done=JSON.parse(JSON.stringify(t));
      done.id=uid();done.status='done';done.archivedOn=today();
      done.recurrence=null;done.recurDays=null;
      state.tasks.push(done);
      const next=nextRecurrenceDate(t,t.scheduledDate);
      if(next){t.scheduledDate=next;}
      else{t.status='done';t.archivedOn=today();}
    } else {
      t.status='done';t.archivedOn=today();
    }
  }
  save();render();
}

function deleteTask(id){
  showConfirm('Delete this task? This cannot be undone.',()=>{
    state.tasks=state.tasks.filter(x=>x.id!==id);save();render();
  });
}

    priority:t.priority, // set live by setTaskPriority
    emoji:t.emoji,
  };
}
function _applyChanges(t,ch){
  Object.assign(t,ch);t.recurDays=null;
}

function saveTaskPopup(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  const ch=_readPopupChanges(t);
  const wasRecurring=t.recurrence&&t.recurrence!=='';
  if(wasRecurring){
    // Store changes, then show choice — must happen AFTER reading the form
    if(!window._pendingRecur)window._pendingRecur={};
    window._pendingRecur[id]=ch;
    showOverlay(`<div class="mini-modal" onclick="event.stopPropagation()" style="max-width:320px">
      <div style="font-size:13px;font-weight:600;color:var(--gray-900);margin-bottom:3px">Edit recurring task</div>
      <div style="font-size:11px;color:var(--gray-400);margin-bottom:14px">Which occurrences should change?</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div class="recur-choice-btn" onclick="saveThisOccurrence('${id}')">
          <div style="font-size:12px;font-weight:500;color:var(--gray-900)">Only this occurrence</div>
          <div style="font-size:11px;color:var(--gray-400);margin-top:2px">Creates a one-off copy for this date; series continues unchanged</div>
        </div>
        <div class="recur-choice-btn" onclick="saveThisAndFuture('${id}')">
          <div style="font-size:12px;font-weight:500;color:var(--gray-900)">This and all following</div>
          <div style="font-size:11px;color:var(--gray-400);margin-top:2px">Updates this date and all future occurrences in the series</div>
        </div>
      </div>
      <div style="text-align:right;margin-top:14px"><button class="btn-cancel" onclick="openTaskPopup('${id}')">Back</button></div>
    </div>`);
  }else{
    _applyChanges(t,ch);save();closeOverlay();render();
  }
}

function saveThisOccurrence(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  const ch=(window._pendingRecur||{})[id];if(!ch)return;
  // Create standalone one-off copy with edits
  const copy=JSON.parse(JSON.stringify(t));
  copy.id=uid();copy.recurrence=null;copy.recurDays=null;
  _applyChanges(copy,ch);
  state.tasks.push(copy);
  // Advance original task to next occurrence (untouched)
  const next=nextRecurrenceDate(t,t.scheduledDate);
  if(next)t.scheduledDate=next;else{t.recurrence=null;}
  delete window._pendingRecur[id];
  save();closeOverlay();render();
}

function saveThisAndFuture(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  const ch=(window._pendingRecur||{})[id];if(!ch)return;
  _applyChanges(t,ch);
  delete window._pendingRecur[id];
  save();closeOverlay();render();
}

function remMatchesDate(r,date){
  if(r.type==='vacation'){
    const s=r.startDate||r.date,e=r.endDate||r.date;
    return date>=s&&date<=e;
  }
  if(!r.date)return false;
  const isYearly=r.yearly||r.recur==='yearly';
  const isMonthly=r.recur==='monthly';
  if(isYearly)  return r.date.slice(5)===date.slice(5);
  if(isMonthly) return r.date.slice(8)===date.slice(8);
  return r.date===date;
}
function fmtRemDate(r){
  if(r.type==='vacation'){
    const s=r.startDate||r.date,e=r.endDate||r.date;
    if(!s)return'—';
    const fd=d=>{const x=new Date(d+'T12:00:00');if(isNaN(x))return d||'?';return String(x.getDate()).padStart(2,'0')+' '+x.toLocaleDateString('en-GB',{month:'long'});};
    return s===e?fd(s):fd(s)+' – '+fd(e);
  }
  if(!r||!r.date)return'';
  const d=new Date(r.date+'T12:00:00');
  const day=String(d.getDate()).padStart(2,'0');
  const month=d.toLocaleDateString('en-GB',{month:'long'});
  const isYearly=r.yearly||r.recur==='yearly';
  const isMonthly=r.recur==='monthly';
  if(isYearly)  return`${day} ${month}`;
  if(isMonthly) return`${day} of each month`;
  return`${day} ${month} ${d.getFullYear()}`;
}
function remRecurLabel(r){
  if(r.type==='vacation') return'<span style="font-size:9px;color:var(--gray-400);margin-left:4px">🐒</span>';
  if(r.yearly||r.recur==='yearly')  return'<span style="font-size:9px;color:var(--gray-400);margin-left:4px">↺ yearly</span>';
  if(r.recur==='monthly') return'<span style="font-size:9px;color:var(--gray-400);margin-left:4px">↺ monthly</span>';
  return'';
}
function remAutoEmoji(type){return type==='bday'?'🎂':type==='holiday'?'🗓️':type==='vacation'?'🐒':'📌';}

    state.reminders.push({id:uid(),text,date,startDate:date,endDate,emoji:'🐒',type,recur:'once',yearly:false});
    save();renderRemindersPanel();return;
  }
  const isBday=type==='bday',isHoliday=type==='holiday';
  const emoji=isBday?'🎂':isHoliday?'🗓️':(document.getElementById('rem-emoji')?.value?.trim()||'📌');
  const recur=isBday||isHoliday?'yearly':(document.getElementById('rem-recur')?.value||'once');
  const yearly=recur==='yearly';
  state.reminders.push({id:uid(),text,date,emoji,type,recur,yearly});
  save();renderRemindersPanel();
}

function importBulkReminders(){
  const raw=document.getElementById('rem-bulk')?.value||'';
  const MONTHS={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12,
    jan:1,feb:2,mar:3,apr:4,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  const forcedType=document.getElementById('rem-type')?.value;
  let added=0;

  // ── Step 1: Extract vacation range lines (YYYY-MM-DD YYYY-MM-DD text) BEFORE splitting
  const vacRanges=[];
  const withoutVacRanges=raw.replace(/(\d{4}-\d{2}-\d{2})\s+(\d{4}-\d{2}-\d{2})\s+([^\n]+)/g,(match,d1,d2,txt)=>{
    vacRanges.push({startDate:d1,endDate:d2,text:txt.trim()});
    return '';
  });
  vacRanges.forEach(v=>{
    state.reminders.push({id:uid(),text:v.text,date:v.startDate,startDate:v.startDate,endDate:v.endDate,emoji:'🐒',type:'vacation',recur:'once',yearly:false});
    added++;
  });

  // ── Step 2: Auto-split concatenated entries (non-vacation lines)
  const MRE='Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:tember)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?';
  const normalized=withoutVacRanges.replace(
    new RegExp(`([^\\d\\n])(?=(\\d{1,2}\\s+(?:${MRE})\\s|\\d{4}-\\d{2}-\\d{2}|\\d{1,2}[-./]\\d{1,2}\\s))`,'gi'),
    '$1\n'
  );
  const lines=normalized.split('\n').map(l=>l.trim()).filter(Boolean);

  // ── Step 3: Process single-date lines
  lines.forEach(line=>{
    let date=null,text='';
    // Try YYYY-MM-DD
    const m1=line.match(/^(\d{4}-\d{2}-\d{2})\s+(.+)$/);
    if(m1){date=m1[1];text=m1[2].trim();}
    else{
      // Try DD-MM (no year — yearly by default)
      const m3=line.match(/^(\d{1,2})[.\-\/](\d{1,2})\s+(.+)$/);
      if(m3){
        const yr=new Date().getFullYear();
        date=`${yr}-${String(m3[2]).padStart(2,'0')}-${String(m3[1]).padStart(2,'0')}`;
        text=m3[3].trim();
      } else {
        // Try DD Month text
        const m2=line.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(.+)$/);
        if(m2){
          const mo=MONTHS[m2[2].toLowerCase()];
          if(mo){const yr=new Date().getFullYear();date=`${yr}-${String(mo).padStart(2,'0')}-${String(m2[1]).padStart(2,'0')}`;text=m2[3].trim();}
        }
      }
    }
    if(!date||!text)return;
    // Use the dropdown type if explicitly chosen (not 'custom'), else auto-detect
    const tl=text.toLowerCase();
    const autoType=tl.includes('birthday')||tl.includes('bday')?'bday':
                   tl.includes('holiday')||tl.includes('day of')||tl.includes('constitution')||tl.includes('independence')?'holiday':'custom';
    const type=(forcedType&&forcedType!=='custom'&&forcedType!=='vacation')?forcedType:autoType;
    const emoji=remAutoEmoji(type);
    const recur=type==='bday'||type==='holiday'?'yearly':'once';
    state.reminders.push({id:uid(),text,date,emoji,type,recur,yearly:recur==='yearly'});
    added++;
  });

  if(added){save();showNotif(`Added ${added} reminder${added===1?'':'s'}`);renderRemindersPanel();}
  else showNotif('No valid lines. Use: DD-MM Name, YYYY-MM-DD Name, DD Month Name, or YYYY-MM-DD YYYY-MM-DD Day-Off name');
}

let _clockTimer=null;
function startClock(){
  clearInterval(_clockTimer);
  function tick(){
    const now=new Date();
    const uaTime=now.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Kiev'});
    const localTime=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    const ua=document.getElementById('clk-ua'),loc=document.getElementById('clk-local');
    if(ua)ua.textContent=uaTime;
    if(loc)loc.textContent=localTime;
    const lbl=document.getElementById('clk-local-lbl');
    if(lbl&&state.userCity)lbl.textContent=state.userCity;
  }
  tick();
  _clockTimer=setInterval(tick,1000);
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function setTab(tab){state.activeTab=tab;save();render();}
function changeWeek(n){if(n===0)state.weekOffset=0;else state.weekOffset+=n;_mobileDayIdx=null;save();fetchWeather();render();}

// ── DRAG & DROP TASKS ─────────────────────────────────────────────────────────
let _dragTaskId=null;
function taskDragStart(e,id){
  _dragTaskId=id;
  e.dataTransfer.setData('text/plain',id);
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>document.getElementById('tc-'+id)?.classList.add('dragging'),0);
}
function taskDragOver(e,date){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  document.querySelectorAll('.day-tasks').forEach(el=>el.classList.remove('drag-over'));
  e.currentTarget.classList.add('drag-over');
}
function taskDragLeave(e){
  if(!e.currentTarget.contains(e.relatedTarget)){
    e.currentTarget.classList.remove('drag-over');
  }
}
function taskDrop(e,date){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const id=e.dataTransfer.getData('text/plain')||_dragTaskId;
  if(!id)return;
  const t=state.tasks.find(t=>t.id===id);
  if(t&&t.scheduledDate!==date){
    t.scheduledDate=date;
    // Place at end of target day
    const dayTasks=state.tasks.filter(x=>x.scheduledDate===date&&x.id!==id&&x.status!=='done');
    const maxOrder=dayTasks.reduce((m,x)=>Math.max(m,x.sortOrder??0),0);
    t.sortOrder=maxOrder+1000;
    save();render();
  }
}
function taskDragEnd(e){
  _dragTaskId=null;
  document.querySelectorAll('.tc.dragging').forEach(el=>el.classList.remove('dragging'));
  document.querySelectorAll('.day-tasks.drag-over').forEach(el=>el.classList.remove('drag-over'));
  document.querySelectorAll('.tc.drop-above,.tc.drop-below').forEach(el=>el.classList.remove('drop-above','drop-below'));
}

// ── WITHIN-COLUMN TASK REORDER ────────────────────────────────────────────────
function tcDragOver(e,targetId){
  e.preventDefault();
  e.stopPropagation(); // don't highlight the whole column
  if(_dragTaskId===targetId)return;
  const card=e.currentTarget;
  const rect=card.getBoundingClientRect();
  const isAbove=e.clientY<rect.top+rect.height/2;
  document.querySelectorAll('.tc.drop-above,.tc.drop-below').forEach(el=>el.classList.remove('drop-above','drop-below'));
  card.classList.add(isAbove?'drop-above':'drop-below');
}
function tcDragLeave(e){
  if(!e.currentTarget.contains(e.relatedTarget)){
    e.currentTarget.classList.remove('drop-above','drop-below');
  }
}
function tcDrop(e,targetId){
  e.preventDefault();
  e.stopPropagation();
  const draggedId=e.dataTransfer.getData('text/plain')||_dragTaskId;
  if(!draggedId||draggedId===targetId)return;
  const card=e.currentTarget;
  const rect=card.getBoundingClientRect();
  const insertBefore=e.clientY<rect.top+rect.height/2;
  card.classList.remove('drop-above','drop-below');
  const dragged=state.tasks.find(t=>t.id===draggedId);
  const target=state.tasks.find(t=>t.id===targetId);
  if(!dragged||!target)return;
  // Move to target's day if coming from another day
  dragged.scheduledDate=target.scheduledDate;
  // Get sorted tasks on that day (excluding dragged)
  const dayTasks=state.tasks
    .filter(t=>t.scheduledDate===target.scheduledDate&&t.id!==draggedId&&t.status!=='done')
    .sort((a,b)=>(a.sortOrder??Infinity)-(b.sortOrder??Infinity));
  // Assign initial sortOrders if missing
  dayTasks.forEach((t,i)=>{if(t.sortOrder==null)t.sortOrder=(i+1)*1000;});
  const tIdx=dayTasks.findIndex(t=>t.id===targetId);
  const tOrder=target.sortOrder??(tIdx+1)*1000;
  if(insertBefore){
    const prev=dayTasks[tIdx-1];
    const prevOrder=prev?(prev.sortOrder??0):tOrder-2000;
    dragged.sortOrder=(prevOrder+tOrder)/2;
  } else {
    const next=dayTasks[tIdx+1];
    const nextOrder=next?(next.sortOrder??0):tOrder+2000;
    dragged.sortOrder=(tOrder+nextOrder)/2;
  }
  save();render();
}

// ── OVERLAY ───────────────────────────────────────────────────────────────────
let _overlayMouseDownOnBackdrop=false;
function showOverlay(html){
  document.getElementById('overlay-content').innerHTML=html;
  const ov=document.getElementById('overlay');
  ov.classList.remove('hidden');
  _overlayMouseDownOnBackdrop=false;
}
function closeOverlay(e){
  if(e&&e.target!==document.getElementById('overlay'))return;
  // Only close if the mousedown also started on the backdrop (not dragged from inside popup)
  if(e&&!_overlayMouseDownOnBackdrop)return;
  document.getElementById('overlay').classList.add('hidden');
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('overlay').addEventListener('mousedown',e=>{
    _overlayMouseDownOnBackdrop=(e.target===document.getElementById('overlay'));
  });
});

function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escAttr(s){return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeOverlay({target:document.getElementById('overlay')});
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){const btn=document.querySelector('.btn-save');if(btn)btn.click();}
});

function render(){
  renderSidebar();renderTabs();
  document.getElementById('sidebar').className='sb'+(state.sidebarOpen?'':' closed');
  switch(state.activeTab){
    case'weekly': renderWeekly();break;
    case'today':  renderToday();break;
    case'board':  renderBoard();break;
    case'backlog':renderBacklog();break;
    case'archive':renderArchive();break;
    default:renderWeekly();
  }
}

document.getElementById('toggle-sb-btn').addEventListener('click',()=>{
  state.sidebarOpen=!state.sidebarOpen;
  document.getElementById('sidebar').className='sb'+(state.sidebarOpen?'':' closed');
});

load();cleanupArchive();autoRollover();render();fetchWeather();
// Pull latest data from cloud on startup (if configured)
setTimeout(syncPull,1500);

// ── CLOUD SYNC (JSONbin.io) ───────────────────────────────────────────────────
let syncCfg=JSON.parse(localStorage.getItem('tasker_sync')||'null')||{};
let _syncTimer=null,_syncStatus='idle',_syncLastOk=0;
const SYNC_KEYS=['workspaces','tasks','reminders','lists','wsNotes','userName','userEmoji','userCity','directions'];

function syncPush(force){
  if(!syncCfg.apiKey) return;
  clearTimeout(_syncTimer);
  if(!force){_syncTimer=setTimeout(()=>syncPush(true),3500);return;}
  _syncStatus='syncing';updateSyncDot();
  const data={_ts:Date.now(),_v:2};
  SYNC_KEYS.forEach(k=>data[k]=state[k]);
  const url=syncCfg.binId
    ?`https://api.jsonbin.io/v3/b/${syncCfg.binId}`
    :'https://api.jsonbin.io/v3/b';
  const method=syncCfg.binId?'PUT':'POST';
  const headers={'Content-Type':'application/json','X-Master-Key':syncCfg.apiKey};
  if(!syncCfg.binId){headers['X-Bin-Name']='tasker-data';headers['X-Bin-Private']='false';}
  fetch(url,{method,headers,body:JSON.stringify(data)})
    .then(r=>r.json())
    .then(r=>{
      if(!syncCfg.binId&&r.metadata?.id){
        syncCfg.binId=r.metadata.id;
        localStorage.setItem('tasker_sync',JSON.stringify(syncCfg));
      }
      _syncStatus='ok';_syncLastOk=Date.now();updateSyncDot();
    })
    .catch(()=>{_syncStatus='err';updateSyncDot();});
}

async function syncPull(){
  if(!syncCfg.apiKey||!syncCfg.binId) return;
  try{
    const r=await fetch(`https://api.jsonbin.io/v3/b/${syncCfg.binId}/latest`,{
      headers:{'X-Master-Key':syncCfg.apiKey}
    });
    const j=await r.json();
    const remote=j.record;
    if(!remote||!remote._ts) return;
    const localTs=parseInt(localStorage.getItem('tasker_ts')||'0');
    if(remote._ts>localTs+2000){
      SYNC_KEYS.forEach(k=>{if(remote[k]!==undefined)state[k]=remote[k];});
      localStorage.setItem('tasker_ts',remote._ts);
      ['workspaces','activeWs','directions','tasks','reminders','lists','wsNotes','userName','userEmoji','weekOffset']
        .forEach(k=>localStorage.setItem('tasker_'+k,JSON.stringify(state[k])));
      render();
      showNotif('↓ Дані синхронізовано з хмари');
    }
    _syncStatus='ok';_syncLastOk=Date.now();updateSyncDot();
  }catch(e){console.warn('syncPull err',e);_syncStatus='err';updateSyncDot();}
}

function updateSyncDot(){
  document.querySelectorAll('.sync-dot').forEach(dot=>{
    if(!syncCfg.apiKey){dot.style.display='none';return;}
    dot.style.display='inline-block';
    dot.style.background=_syncStatus==='ok'?'#22c55e':_syncStatus==='err'?'#ef4444':'#f59e0b';
    dot.title=_syncStatus==='ok'?'Synced ✓':_syncStatus==='err'?'Sync error':'Syncing…';
  });
}

function openSync(){
  const cfg=syncCfg;
  const hasKey=!!cfg.apiKey;
  const statusHtml=hasKey
    ?`<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;margin-bottom:4px">
        <span style="font-size:18px">☁️</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:600;color:#15803d">Cloud sync активний</div>
          <div style="font-size:10.5px;color:#16a34a;word-break:break-all">Bin: ${cfg.binId||'(буде створено при першому збереженні)'}</div>
        </div>
        <button onclick="syncPull()" class="btn-sm" style="font-size:10px;flex-shrink:0"><i class="ti ti-refresh" style="font-size:10px"></i> Pull now</button>
      </div>`
    :`<div style="padding:10px 12px;background:#fefce8;border:1px solid #fef08a;border-radius:8px;font-size:11.5px;color:#854d0e;line-height:1.6;margin-bottom:4px">
        <b>Як налаштувати:</b><br>
        1. Зайди на <a href="https://jsonbin.io" target="_blank" style="color:#2563eb">jsonbin.io</a> → Sign up (безплатно)<br>
        2. API Keys → скопіюй <b>$2a$10…</b> ключ<br>
        3. Встав нижче і натисни Save
      </div>`;
  showOverlay(`
    <div style="background:#fff;border-radius:12px;width:460px;max-width:96vw;padding:20px 22px;display:flex;flex-direction:column;gap:14px" onclick="event.stopPropagation()">
      <div style="font-size:14px;font-weight:600;color:var(--gray-900);display:flex;align-items:center;gap:8px">
        <i class="ti ti-cloud" style="font-size:16px;color:var(--blue)"></i> Cloud Sync
        <span class="sync-dot" style="display:none"></span>
      </div>
      ${statusHtml}
      <div style="display:flex;flex-direction:column;gap:6px">
        <label style="font-size:11px;font-weight:600;color:var(--gray-700)">JSONbin.io Master Key</label>
        <input id="sync-key-inp" type="password" placeholder="\$2a\$10…" value="${escHtml(cfg.apiKey||'')}"
          style="border:1px solid var(--gray-200);border-radius:6px;padding:8px 10px;font-size:12px;font-family:monospace;outline:none;width:100%">
        ${cfg.binId?`<label style="font-size:11px;font-weight:600;color:var(--gray-700);margin-top:4px">Bin ID (залиш пустим щоб створити новий)</label>
        <input id="sync-bin-inp" type="text" placeholder="auto" value="${escHtml(cfg.binId||'')}"
          style="border:1px solid var(--gray-200);border-radius:6px;padding:8px 10px;font-size:12px;font-family:monospace;outline:none;width:100%">`:''}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button onclick="saveSyncCfg()" class="btn-sm btn-primary"><i class="ti ti-device-floppy" style="font-size:11px"></i> Save & Sync now</button>
        ${hasKey?`<button onclick="clearSyncCfg()" class="btn-sm" style="color:#dc2626;border-color:#fca5a5"><i class="ti ti-trash" style="font-size:11px"></i> Відключити</button>`:''}
        <button class="btn-sm" onclick="closeOverlay({target:document.getElementById('overlay')})" style="margin-left:auto">Закрити</button>
      </div>
      <div style="border-top:1px solid var(--gray-200);padding-top:12px">
        <div style="font-size:11px;font-weight:600;color:var(--gray-700);margin-bottom:8px">Або разовий перенос (без хмари)</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button onclick="exportOnce()" class="btn-sm"><i class="ti ti-copy" style="font-size:11px"></i> <span class="btn-label">Скопіювати код</span></button>
          <button onclick="showImportOnce()" class="btn-sm"><i class="ti ti-clipboard" style="font-size:11px"></i> <span class="btn-label">Вставити код</span></button>
        </div>
        <div id="once-export-wrap" style="display:none;margin-top:8px;position:relative">
          <textarea id="once-export-ta" readonly style="width:100%;height:60px;font-size:10px;font-family:monospace;border:1px solid var(--gray-200);border-radius:6px;padding:7px 8px;resize:none;background:var(--gray-50)" onclick="this.select()"></textarea>
          <button onclick="copyOnce()" id="once-copy-btn" style="position:absolute;bottom:7px;right:7px;background:var(--blue);color:#fff;border:none;border-radius:5px;padding:3px 10px;font-size:10px;cursor:pointer">Copy</button>
        </div>
        <div id="once-import-wrap" style="display:none;margin-top:8px">
          <textarea id="once-import-ta" placeholder="Встав код тут…" style="width:100%;height:60px;font-size:10px;font-family:monospace;border:1px solid var(--gray-200);border-radius:6px;padding:7px 8px;resize:none"></textarea>
          <button onclick="importOnce()" class="btn-sm btn-primary" style="margin-top:6px"><i class="ti ti-download" style="font-size:11px"></i> Завантажити</button>
        </div>
      </div>
    </div>
  `);
  setTimeout(updateSyncDot,0);
}

function saveSyncCfg(){
  const key=(document.getElementById('sync-key-inp').value||'').trim();
  const binInp=document.getElementById('sync-bin-inp');
  const bin=binInp?(binInp.value||'').trim():'';
  if(!key){alert('Введи API ключ');return;}
  syncCfg={apiKey:key,binId:bin||syncCfg.binId||''};
  localStorage.setItem('tasker_sync',JSON.stringify(syncCfg));
  syncPush(true);
  closeOverlay({target:document.getElementById('overlay')});
  showNotif('☁️ Sync налаштовано — дані завантажуються…');
  setTimeout(syncPull,2000);
}
function clearSyncCfg(){
  if(!confirm('Відключити cloud sync? Дані на пристрої залишаться.'))return;
  syncCfg={};localStorage.removeItem('tasker_sync');
  _syncStatus='idle';updateSyncDot();
  closeOverlay({target:document.getElementById('overlay')});
}
function exportOnce(){
  const snap={_v:2,_ts:Date.now()};
  SYNC_KEYS.forEach(k=>snap[k]=state[k]);
  const b64=btoa(unescape(encodeURIComponent(JSON.stringify(snap))));
  document.getElementById('once-export-wrap').style.display='block';
  document.getElementById('once-import-wrap').style.display='none';
  document.getElementById('once-export-ta').value=b64;
}
function copyOnce(){
  const ta=document.getElementById('once-export-ta');ta.select();
  navigator.clipboard.writeText(ta.value).then(()=>{
    const b=document.getElementById('once-copy-btn');b.textContent='Copied ✓';b.style.background='#16a34a';
    setTimeout(()=>{b.textContent='Copy';b.style.background='var(--blue)';},2000);
  }).catch(()=>document.execCommand('copy'));
}
function showImportOnce(){
  document.getElementById('once-import-wrap').style.display='block';
  document.getElementById('once-export-wrap').style.display='none';
}
function importOnce(){
  const raw=(document.getElementById('once-import-ta').value||'').trim();
  if(!raw){alert('Встав код!');return;}
  try{
    const snap=JSON.parse(decodeURIComponent(escape(atob(raw))));
    SYNC_KEYS.forEach(k=>{if(snap[k]!==undefined)state[k]=snap[k];});
    save();render();
    closeOverlay({target:document.getElementById('overlay')});
    showNotif('✓ Дані завантажено!');
  }catch(e){alert('Невірний код');}
}
</script>
