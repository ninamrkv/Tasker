<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flo — Personal Planning</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f4f6;height:100vh;overflow:hidden}
:root{--sb-w:210px;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;--gray-600:#4b5563;--gray-700:#374151;--gray-900:#111827;--blue:#3B82F6;--red:#E24B4A}

/* SHELL */
.shell{display:flex;height:100vh;overflow:hidden;background:#fff}

/* SIDEBAR */
.sb{width:var(--sb-w);flex-shrink:0;background:var(--gray-100);border-right:1px solid var(--gray-200);display:flex;flex-direction:column;overflow:hidden;transition:width .2s ease,opacity .15s ease}
.sb.closed{width:0;opacity:0;border-right:none}
.sb-top{padding:12px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;gap:8px;flex-shrink:0}
.sb-logo{width:24px;height:24px;background:var(--blue);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-logo i{font-size:14px;color:#fff}
.sb-appname{font-size:13px;font-weight:600;color:var(--gray-900);white-space:nowrap}
.sb-scroll{flex:1;overflow-y:auto;padding:8px 8px 0}
.sb-sec-label{font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.07em;padding:10px 6px 4px;white-space:nowrap}
.sb-item{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--gray-600);white-space:nowrap;user-select:none}
.sb-item:hover{background:#e9eaec}
.sb-item.active{background:#fff;color:var(--gray-900);font-weight:500}
.sb-item i{font-size:14px;flex-shrink:0}
.sb-ws-emoji{font-size:13px;flex-shrink:0}
.sb-add{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:11px;color:var(--gray-400);cursor:pointer;border-radius:6px}
.sb-add:hover{background:#e9eaec;color:var(--gray-600)}
.sb-bottom{padding:10px;border-top:1px solid var(--gray-200);flex-shrink:0}
.sb-user{display:flex;align-items:center;gap:8px;padding:4px;border-radius:6px;cursor:pointer}
.sb-user:hover{background:#e9eaec}
.sb-avatar{width:26px;height:26px;border-radius:50%;background:#dbeafe;color:#1e40af;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-uname{font-size:12px;color:var(--gray-900);white-space:nowrap}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:#fff}
.topbar{padding:0 16px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;flex-shrink:0;gap:2px}
.toggle-sb{background:none;border:none;cursor:pointer;padding:10px 8px 10px 0;color:var(--gray-400);display:flex;align-items:center;flex-shrink:0}
.toggle-sb:hover{color:var(--gray-700)}
.toggle-sb i{font-size:16px}
.tabs{display:flex;align-items:flex-end;flex:1;overflow:hidden}
.tab{padding:10px 12px;font-size:12px;color:var(--gray-400);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px;user-select:none}
.tab i{font-size:12px}
.tab.active{color:var(--gray-900);border-bottom-color:var(--gray-900);font-weight:500}
.tab-actions{margin-left:auto;display:flex;align-items:center;gap:6px;padding:0 4px}
.btn-sm{background:none;border:1px solid var(--gray-200);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--gray-600);cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
.btn-sm:hover{background:var(--gray-100);border-color:var(--gray-300)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:#2563eb;border-color:#2563eb}

/* CONTENT */
.content{flex:1;overflow-y:auto}
.page-pad{padding:20px 24px}
.page-emoji{font-size:32px;margin-bottom:4px;display:block;cursor:pointer}
.page-title{font-size:22px;font-weight:600;color:var(--gray-900);margin-bottom:2px}
.page-sub{font-size:12px;color:var(--gray-400)}
.week-bar{display:flex;align-items:center;gap:8px;padding:8px 24px 10px}
.nav-btn{background:none;border:1px solid var(--gray-200);border-radius:6px;padding:3px 9px;font-size:11px;color:var(--gray-600);cursor:pointer}
.nav-btn:hover{background:var(--gray-100)}
.week-label{font-size:12px;color:var(--gray-600);font-weight:500}

/* CALENDAR */
.cal-wrap{margin:0 24px 24px;border:1px solid var(--gray-200);border-radius:10px;overflow:hidden}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-grid.today-wider{grid-template-columns:.7fr .7fr .7fr 1.35fr .7fr .7fr .7fr}
.day-col{border-right:1px solid var(--gray-200);display:flex;flex-direction:column;min-width:0}
.day-col:last-child{border-right:none}
.day-hdr{height:72px;padding:7px 8px 5px;border-bottom:1px solid var(--gray-200);display:flex;flex-direction:column;gap:2px;flex-shrink:0;background:#fff}
.day-hdr.today-hdr{background:#fef2f2}
.d-name{font-size:9px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.06em}
.d-name.today-label{color:var(--red);font-weight:600}
.d-num{font-size:13px;font-weight:500;color:var(--gray-600);line-height:1}
.d-num.today-circle{color:#fff!important;background:var(--red);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.d-weather{font-size:9px;color:var(--gray-400);display:flex;align-items:center;gap:2px;white-space:nowrap}
.d-weather.today-w{color:var(--gray-600)}
.d-reminders{display:flex;flex-direction:column;gap:1px}
.d-reminder{font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.d-reminder.bday{color:#be185d}
.d-reminder.holiday{color:#0369a1}
.d-reminder.custom{color:var(--gray-600)}
.day-tasks{padding:4px;display:flex;flex-direction:column;gap:3px;background:var(--gray-50);flex:1;overflow-y:auto;min-height:120px}

/* TASK CARD */
.tc{background:#fff;border:1px solid var(--gray-200);border-left-width:3px;border-radius:5px;padding:4px 6px 4px 5px;cursor:pointer;flex-shrink:0;display:flex;align-items:flex-start;gap:4px;transition:background .1s}
.tc:hover{background:var(--gray-50)}
.tc-cb{width:11px;height:11px;border-radius:3px;border:1px solid var(--gray-300);flex-shrink:0;margin-top:2px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s}
.tc:hover .tc-cb{border-color:var(--gray-400)}
.tc-cb.done-cb{background:var(--gray-400);border-color:var(--gray-400)}
.tc-cb.done-cb::after{content:'';width:6px;height:3.5px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block}
.tc-body{flex:1;min-width:0}
.tc-dir{font-size:9px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.tc-name{font-size:10.5px;color:var(--gray-900);line-height:1.35}
.tc-meta{display:flex;align-items:center;gap:3px;margin-top:3px}
.tc-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.tc-deadline{font-size:8.5px;color:var(--gray-400)}
.tc-deadline.overdue{color:#dc2626}
.tc.is-done{opacity:.35}
.tc.is-done .tc-name{text-decoration:line-through}
.tc.rolled .tc-dir::before{content:'↩ '}
.add-task-row{height:20px;flex-shrink:0;background:var(--gray-50);display:flex;align-items:center;padding:0 5px;border-top:1px solid var(--gray-200)}
.add-task-btn{background:none;border:none;cursor:pointer;color:transparent;font-size:11px;display:flex;align-items:center;justify-content:center;width:18px;height:16px;border-radius:3px;transition:color .1s,background .1s;padding:0}
.day-col:hover .add-task-btn{color:var(--gray-300)}
.add-task-btn:hover{background:var(--gray-200)!important;color:var(--gray-600)!important}

/* SECTIONS DIVIDER */
.section-title{font-size:13px;font-weight:500;color:var(--gray-700);display:flex;align-items:center;gap:6px;margin-bottom:12px}
.section-title i{font-size:14px;color:var(--gray-400)}

/* LISTS */
.lists-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.list-card{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:12px}
.list-card-title{font-size:12px;font-weight:500;color:var(--gray-700);margin-bottom:8px;display:flex;align-items:center;gap:5px;cursor:pointer}
.list-item{display:flex;align-items:flex-start;gap:7px;padding:3px 0}
.li-cb{width:13px;height:13px;border-radius:3px;border:1px solid var(--gray-300);flex-shrink:0;margin-top:1px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.li-cb.li-done{background:var(--blue);border-color:var(--blue)}
.li-cb.li-done::after{content:'';width:7px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block}
.li-text{font-size:11px;color:var(--gray-700);line-height:1.5;cursor:pointer}
.li-text.li-done-text{text-decoration:line-through;color:var(--gray-400)}
.li-add{font-size:11px;color:var(--gray-400);padding:3px 0;cursor:pointer;display:flex;align-items:center;gap:4px}
.li-add:hover{color:var(--gray-600)}
.add-list-btn{border:1px dashed var(--gray-300);border-radius:8px;padding:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--gray-400);cursor:pointer;min-height:60px}
.add-list-btn:hover{background:var(--gray-50);border-color:var(--gray-400);color:var(--gray-600)}

/* BOARD VIEW */
.board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:0 24px 24px}
.board-col{background:var(--gray-50);border-radius:8px;border:1px solid var(--gray-200);overflow:hidden}
.board-col-hdr{padding:10px 12px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--gray-200)}
.board-col-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.board-col-name{font-size:12px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-col-count{font-size:10px;color:var(--gray-400)}
.board-cards{padding:6px;display:flex;flex-direction:column;gap:4px;min-height:60px}
.board-add{padding:4px 8px 8px}
.board-add-btn{background:none;border:none;font-size:10px;color:var(--gray-400);cursor:pointer;display:flex;align-items:center;gap:3px;padding:3px 4px;border-radius:4px;width:100%}
.board-add-btn:hover{background:var(--gray-200);color:var(--gray-600)}

/* TABLE VIEW (Today/Backlog/Archive) */
.task-table{width:100%;border-collapse:collapse}
.task-table th{font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.06em;padding:6px 12px;border-bottom:1px solid var(--gray-200);text-align:left;font-weight:500}
.task-table td{padding:7px 12px;border-bottom:1px solid var(--gray-100);font-size:12px;color:var(--gray-700);vertical-align:middle}
.task-table tr:hover td{background:var(--gray-50)}
.tt-dir-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;background:#f1f5f9}
.tt-status{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500}
.tt-done{background:#f0fdf4;color:#15803d}
.tt-todo{background:#f8fafc;color:var(--gray-600)}
.tt-rolled{background:#fff7ed;color:#c2410c}
.tt-urgent{background:#fff1f2;color:#be123c}
.empty-state{text-align:center;padding:48px 24px;color:var(--gray-400)}
.empty-state i{font-size:36px;margin-bottom:8px;display:block}
.empty-state p{font-size:13px}

/* POPUP */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.overlay.hidden{display:none}
.popup{background:#fff;border-radius:12px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.popup-cover{height:90px;background:linear-gradient(135deg,#dbeafe,#ede9fe);position:relative;border-radius:12px 12px 0 0;display:flex;align-items:flex-end;padding:8px 14px;cursor:pointer}
.popup-cover-hint{font-size:10px;color:rgba(30,58,138,.5)}
.popup-cover-change{position:absolute;top:8px;right:36px;background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.1);border-radius:5px;padding:3px 8px;font-size:10px;color:var(--gray-700);cursor:pointer;display:flex;align-items:center;gap:3px}
.popup-close{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.1);border-radius:5px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--gray-600)}
.popup-close:hover{background:#fff}
.popup-body{padding:14px 18px 20px}
.popup-title-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.popup-emoji-btn{font-size:22px;cursor:pointer;background:none;border:none;padding:0;line-height:1}
.popup-name-input{flex:1;font-size:18px;font-weight:600;color:var(--gray-900);border:none;outline:none;background:transparent;min-width:0}
.popup-name-input::placeholder{color:var(--gray-300)}
.popup-props{border-top:1px solid var(--gray-100)}
.prop-row{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid var(--gray-100);gap:0}
.prop-row:last-child{border-bottom:none}
.prop-label{font-size:11px;color:var(--gray-400);width:110px;flex-shrink:0;display:flex;align-items:center;gap:5px}
.prop-label i{font-size:13px}
.prop-val{flex:1;font-size:12px;color:var(--gray-700);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prop-val select,.prop-val input[type=text],.prop-val input[type=date]{background:none;border:none;outline:none;font-size:12px;color:var(--gray-700);font-family:inherit;cursor:pointer;max-width:200px}
.prop-val select:hover,.prop-val input:hover{color:var(--gray-900)}
.popup-notes-label{font-size:11px;color:var(--gray-400);margin-top:12px;margin-bottom:4px}
.popup-notes{width:100%;border:1px solid var(--gray-200);border-radius:6px;padding:8px 10px;font-size:12px;color:var(--gray-700);resize:vertical;min-height:60px;font-family:inherit;outline:none}
.popup-notes:focus{border-color:var(--blue)}
.popup-actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.btn-danger{background:none;border:1px solid #fca5a5;border-radius:6px;padding:5px 12px;font-size:11px;color:#dc2626;cursor:pointer}
.btn-danger:hover{background:#fef2f2}
.btn-save{background:var(--blue);border:none;border-radius:6px;padding:6px 16px;font-size:12px;color:#fff;cursor:pointer;font-weight:500}
.btn-save:hover{background:#2563eb}
.priority-dots{display:flex;align-items:center;gap:6px}
.p-dot{width:12px;height:12px;border-radius:50%;cursor:pointer;opacity:.35;transition:opacity .1s,transform .1s;border:2px solid transparent}
.p-dot.selected{opacity:1;transform:scale(1.15)}
.p-dot:hover{opacity:.7}
.p-dot-high{background:#ef4444}
.p-dot-med{background:#eab308}
.p-dot-low{background:#22c55e}
.p-dot-none{background:var(--gray-300)}

/* ADD TASK POPUP */
.quick-add{background:#fff;border-radius:10px;width:100%;max-width:440px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.qa-title{font-size:14px;font-weight:500;color:var(--gray-900);margin-bottom:14px}
.qa-input{width:100%;border:1px solid var(--gray-200);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--gray-900);outline:none;font-family:inherit;margin-bottom:10px}
.qa-input:focus{border-color:var(--blue)}
.qa-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qa-select{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:5px;padding:4px 8px;font-size:11px;color:var(--gray-700);outline:none;font-family:inherit;cursor:pointer}
.qa-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.btn-cancel{background:none;border:1px solid var(--gray-200);border-radius:6px;padding:5px 14px;font-size:12px;color:var(--gray-600);cursor:pointer}
.btn-cancel:hover{background:var(--gray-100)}

/* REMINDERS PANEL */
.rem-panel{background:#fff;border-radius:10px;width:100%;max-width:480px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.rem-tabs{display:flex;gap:8px;margin-bottom:14px}
.rem-tab{padding:4px 12px;border-radius:20px;font-size:11px;cursor:pointer;border:1px solid var(--gray-200);color:var(--gray-600)}
.rem-tab.active{background:var(--gray-900);color:#fff;border-color:var(--gray-900)}
.rem-list{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto;margin-bottom:12px}
.rem-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--gray-200);border-radius:6px;font-size:12px}
.rem-item-emoji{font-size:14px}
.rem-item-text{flex:1;color:var(--gray-700)}
.rem-item-date{font-size:10px;color:var(--gray-400)}
.rem-item-del{background:none;border:none;cursor:pointer;color:var(--gray-300);font-size:13px;padding:2px}
.rem-item-del:hover{color:#dc2626}
.rem-add-form{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--gray-200)}
.rem-add-row{display:flex;gap:8px}
.rem-input{flex:1;border:1px solid var(--gray-200);border-radius:6px;padding:6px 10px;font-size:12px;outline:none;font-family:inherit}
.rem-input:focus{border-color:var(--blue)}
.bulk-hint{font-size:10px;color:var(--gray-400);line-height:1.5}
.bulk-textarea{width:100%;border:1px solid var(--gray-200);border-radius:6px;padding:7px 10px;font-size:11px;height:64px;resize:none;outline:none;font-family:monospace}
.bulk-textarea:focus{border-color:var(--blue)}

/* DIRECTION SETTINGS */
.dir-settings{background:#fff;border-radius:10px;width:100%;max-width:480px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.15);max-height:85vh;overflow-y:auto}
.dir-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--gray-200);border-radius:7px;margin-bottom:6px}
.dir-color-btn{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:transform .1s}
.dir-color-btn:hover{transform:scale(1.15)}
.dir-name-input{flex:1;border:none;outline:none;font-size:12px;color:var(--gray-900);font-family:inherit;background:transparent}
.dir-emoji-btn{font-size:16px;cursor:pointer;background:none;border:none;padding:0;flex-shrink:0}
.dir-del-btn{background:none;border:none;cursor:pointer;color:var(--gray-300);font-size:13px}
.dir-del-btn:hover{color:#dc2626}
.color-picker-row{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0}
.color-swatch{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.color-swatch:hover,.color-swatch.sel{transform:scale(1.2);border-color:var(--gray-400)}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:4px}

/* RESPONSIVE */
@media(max-width:700px){
  .sb{position:fixed;z-index:50;height:100%;box-shadow:4px 0 20px rgba(0,0,0,.1)}
  .tab span{display:none}
}
</style>
</head>
<body>

<div class="shell" id="shell">
  <!-- SIDEBAR -->
  <div class="sb" id="sidebar">
    <div class="sb-top">
      <div class="sb-logo"><i class="ti ti-target"></i></div>
      <span class="sb-appname">Flo</span>
    </div>
    <div class="sb-scroll" id="sb-scroll"></div>
    <div class="sb-bottom">
      <div class="sb-user">
        <div class="sb-avatar" id="user-avatar">?</div>
        <span class="sb-uname" id="user-name">My Account</span>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main" id="main">
    <div class="topbar">
      <button class="toggle-sb" id="toggle-sb-btn" title="Toggle sidebar">
        <i class="ti ti-layout-sidebar"></i>
      </button>
      <div class="tabs" id="tabs"></div>
      <div class="tab-actions" id="tab-actions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- OVERLAYS -->
<div class="overlay hidden" id="overlay" onclick="closeOverlay(event)">
  <div id="overlay-content"></div>
</div>

<script>
// ─── UTILS ───────────────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2,10);
const today = () => new Date().toISOString().slice(0,10);
const fmt = d => d ? new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '';
const isoDate = d => d.toISOString().slice(0,10);
const addDays = (d,n) => { const x=new Date(d+'T12:00:00'); x.setDate(x.getDate()+n); return isoDate(x); };
const dayOfWeek = d => new Date(d+'T12:00:00').getDay(); // 0=Sun
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_NAMES_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function getWeekDates(offset=0){
  const now = new Date();
  const dow = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (dow===0?6:dow-1) + offset*7);
  return Array.from({length:7},(_,i)=>{ const d=new Date(monday); d.setDate(monday.getDate()+i); return isoDate(d); });
}

// ─── DEFAULT DATA ─────────────────────────────────────────────────────────────
const DEFAULT_DIRECTIONS = [
  {id:'drr',   name:'UNICEF: DRR',       color:'#3B82F6', emoji:'🔵', category:'work'},
  {id:'wash',  name:'UNICEF: WASH',      color:'#22C55E', emoji:'💧', category:'work'},
  {id:'nutr',  name:'UNICEF: Nutrition', color:'#F97316', emoji:'🥗', category:'work'},
  {id:'rep',   name:'UNICEF: Reporting', color:'#A855F7', emoji:'📊', category:'work'},
  {id:'nalyv', name:'Bilyi Nalyv',       color:'#EC4899', emoji:'🌿', category:'work'},
  {id:'eng',   name:'English',           color:'#EAB308', emoji:'📖', category:'personal'},
  {id:'food',  name:'Food',              color:'#F97316', emoji:'🛒', category:'personal'},
  {id:'gym',   name:'Gym',               color:'#EF4444', emoji:'🏋️', category:'personal'},
  {id:'clean', name:'Cleaning',          color:'#6B7280', emoji:'🧹', category:'personal'},
  {id:'laund', name:'Laundry',           color:'#9CA3AF', emoji:'🧺', category:'personal'},
  {id:'trav',  name:'Travel',            color:'#0EA5E9', emoji:'✈️', category:'personal'},
];

const DEFAULT_WORKSPACES = [
  {id:'ws1', name:'Planning', emoji:'🎯'},
  {id:'ws2', name:'Learning', emoji:'📚'},
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let state = {
  workspaces: DEFAULT_WORKSPACES,
  activeWs: 'ws1',
  activeTab: 'weekly',
  sidebarOpen: true,
  weekOffset: 0,
  directions: DEFAULT_DIRECTIONS,
  tasks: [],
  reminders: [],
  lists: [],
  userName: 'Nina',
  weather: {},
  userCity: null,
};

// ─── PERSISTENCE ──────────────────────────────────────────────────────────────
function save(){
  const keys = ['workspaces','activeWs','directions','tasks','reminders','lists','userName','weekOffset'];
  keys.forEach(k => localStorage.setItem('flo_'+k, JSON.stringify(state[k])));
}
function load(){
  const keys = ['workspaces','activeWs','directions','tasks','reminders','lists','userName','weekOffset'];
  keys.forEach(k => {
    const v = localStorage.getItem('flo_'+k);
    if(v) state[k] = JSON.parse(v);
  });
  state.weekOffset = state.weekOffset || 0;
}

// ─── AUTO ARCHIVE CLEANUP ─────────────────────────────────────────────────────
function cleanupArchive(){
  const cutoff = addDays(today(), -30);
  const before = state.tasks.length;
  state.tasks = state.tasks.filter(t => {
    if(t.status==='done' && t.archivedOn && t.archivedOn < cutoff) return false;
    return true;
  });
  if(state.tasks.length !== before) save();
}

// ─── AUTO ROLLOVER ────────────────────────────────────────────────────────────
function autoRollover(){
  const td = today();
  let changed = false;
  state.tasks.forEach(t => {
    if(t.status==='todo' && t.scheduledDate && t.scheduledDate < td){
      t.status = 'rolled';
      t.scheduledDate = findNextSlot(t.scheduledDate, t);
      changed = true;
    }
  });
  if(changed) save();
}

function tasksOnDate(date, excludeId=null){
  return state.tasks.filter(t => t.scheduledDate===date && t.id!==excludeId && t.status!=='done').length;
}

function findNextSlot(fromDate, task){
  let d = addDays(fromDate, 1);
  let safety = 0;
  while(tasksOnDate(d, task.id) >= 10 && safety < 30){ d = addDays(d,1); safety++; }
  return d;
}

// ─── SCHEDULE TASK ────────────────────────────────────────────────────────────
function autoSchedule(task){
  if(task.recurDays && task.recurDays.length){
    const weekDates = getWeekDates(state.weekOffset);
    for(const d of weekDates){
      const dow = dayOfWeek(d);
      if(task.recurDays.includes(dow) && tasksOnDate(d, task.id) < 10){
        task.scheduledDate = d; return;
      }
    }
  }
  // find first day in current/next week with slot
  const weekDates = getWeekDates(state.weekOffset);
  for(const d of weekDates){
    if(d >= today() && tasksOnDate(d, task.id) < 10){ task.scheduledDate = d; return; }
  }
  task.scheduledDate = today();
}

// ─── WEATHER ─────────────────────────────────────────────────────────────────
async function fetchWeather(){
  try{
    const pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000}));
    const {latitude:lat, longitude:lon} = pos.coords;
    // reverse geocode city name
    const geo = await fetch(`https://wttr.in/${lat},${lon}?format=j1`).then(r=>r.json());
    const area = geo.nearest_area?.[0];
    state.userCity = area?.areaName?.[0]?.value || '';
    const weather = geo.current_condition?.[0];
    if(weather){
      const code = parseInt(weather.weatherCode);
      const icon = weatherIcon(code);
      const temp = weather.temp_C;
      const weekDates = getWeekDates(state.weekOffset);
      weekDates.forEach((d,i)=>{
        const day = geo.weather?.[Math.min(i, (geo.weather?.length||1)-1)];
        const maxC = day?.maxtempC || temp;
        const minC = day?.mintempC || temp;
        const wcode = parseInt(day?.hourly?.[4]?.weatherCode || code);
        state.weather[d] = { icon: weatherIcon(wcode), temp: `${Math.round((parseInt(maxC)+parseInt(minC))/2)}°` };
      });
    }
    render();
  }catch(e){
    // geolocation denied or failed — use IP
    try{
      const r = await fetch('https://wttr.in/?format=j1').then(x=>x.json());
      const area = r.nearest_area?.[0];
      state.userCity = area?.areaName?.[0]?.value || '';
      const w = r.current_condition?.[0];
      if(w){
        const weekDates = getWeekDates(state.weekOffset);
        weekDates.forEach(d=>{ state.weather[d]={icon:weatherIcon(parseInt(w.weatherCode)),temp:`${w.temp_C}°`}; });
      }
      render();
    }catch(e2){}
  }
}

function weatherIcon(code){
  if(code<=113) return '☀️';
  if(code<=116) return '🌤️';
  if(code<=119) return '☁️';
  if(code<=143) return '🌫️';
  if(code<=176) return '🌦️';
  if(code<=260) return '🌧️';
  if(code<=350) return '🌨️';
  if(code<=389) return '⛈️';
  return '🌨️';
}

// ─── RENDER HELPERS ───────────────────────────────────────────────────────────
function dirById(id){ return state.directions.find(d=>d.id===id) || {name:'—',color:'#9CA3AF',emoji:''} }

function renderPriorityDot(priority, size=8){
  if(!priority) return '';
  const colors = {high:'#ef4444',medium:'#eab308',low:'#22c55e'};
  return `<span style="display:inline-block;width:${size}px;height:${size}px;border-radius:50%;background:${colors[priority]||'#ccc'};flex-shrink:0"></span>`;
}

// ─── WEEKLY VIEW ──────────────────────────────────────────────────────────────
function renderWeekly(){
  const ws = state.workspaces.find(w=>w.id===state.activeWs) || state.workspaces[0];
  const dates = getWeekDates(state.weekOffset);
  const td = today();
  const startFmt = fmt(dates[0]);
  const endFmt = fmt(dates[6]);

  let html = `
    <div class="page-pad" style="padding-bottom:8px">
      <span class="page-emoji" onclick="changeWsEmoji()">${ws.emoji}</span>
      <div class="page-title" contenteditable="true" onblur="renameWs(this.textContent)">${ws.name}</div>
    </div>
    <div class="week-bar">
      <button class="nav-btn" onclick="changeWeek(-1)">‹</button>
      <button class="nav-btn" onclick="changeWeek(0)">Today</button>
      <button class="nav-btn" onclick="changeWeek(1)">›</button>
      <span class="week-label">${startFmt} – ${endFmt}</span>
    </div>
    <div class="cal-wrap">
      <div class="cal-grid today-wider" id="cal-grid">`;

  dates.forEach(date=>{
    const isToday = date===td;
    const dow = dayOfWeek(date);
    const dayName = DAY_NAMES[dow];
    const dayNum = date.slice(8);
    const w = state.weather[date];
    const rems = state.reminders.filter(r=>r.date===date);
    const tasks = state.tasks
      .filter(t=>t.scheduledDate===date && t.workspaceId===state.activeWs)
      .sort((a,b)=>{
        const po={urgent:0,high:1,medium:2,low:3,null:4};
        return (po[a.type==='urgent'?'urgent':a.priority]||4)-(po[b.type==='urgent'?'urgent':b.priority]||4);
      });

    html += `<div class="day-col" id="dc-${date}">
      <div class="day-hdr ${isToday?'today-hdr':''}">
        <div class="d-name ${isToday?'today-label':''}">${isToday?'Today · ':''} ${dayName}</div>
        <div class="d-num ${isToday?'today-circle':''}">${dayNum}</div>
        <div class="d-weather ${isToday?'today-w':''}">${w?`${w.icon} ${w.temp}${isToday&&state.userCity?' · '+state.userCity:''}`:''}</div>
        <div class="d-reminders">${rems.map(r=>`<div class="d-reminder ${r.type}" title="${r.text}">${r.emoji||'📌'} ${r.text}</div>`).join('')}</div>
      </div>
      <div class="day-tasks" id="dt-${date}">
        ${tasks.map(t=>renderTaskCard(t)).join('')}
      </div>
      <div class="add-task-row">
        <button class="add-task-btn" onclick="openAddTask('${date}')" title="Add task"><i class="ti ti-plus" style="font-size:10px"></i></button>
      </div>
    </div>`;
  });

  html += `</div></div>`;

  // Lists section
  const lists = state.lists.filter(l=>l.workspaceId===state.activeWs);
  if(lists.length || true){
    html += `<div class="page-pad">
      <div class="section-title"><i class="ti ti-layout-grid"></i> Lists</div>
      <div class="lists-grid">
        ${lists.map(l=>renderListCard(l)).join('')}
        <div class="add-list-btn" onclick="addList()"><i class="ti ti-plus" style="font-size:14px"></i> New list</div>
      </div>
    </div>`;
  }

  document.getElementById('content').innerHTML = html;
}

function renderTaskCard(t){
  const dir = dirById(t.directionId);
  const isDone = t.status==='done';
  const isRolled = t.status==='rolled';
  const deadline = t.deadline && t.deadline < today() && !isDone
    ? `<span class="tc-deadline overdue">${fmt(t.deadline)}</span>`
    : t.deadline ? `<span class="tc-deadline">${fmt(t.deadline)}</span>` : '';

  return `<div class="tc ${isDone?'is-done':''} ${isRolled?'rolled':''}" style="border-left-color:${dir.color}" data-id="${t.id}">
    <div class="tc-cb ${isDone?'done-cb':''}" onclick="toggleDone(event,'${t.id}')"></div>
    <div class="tc-body" onclick="openTaskPopup('${t.id}')">
      <div class="tc-dir" style="color:${dir.color}">${dir.emoji} ${dir.name}</div>
      <div class="tc-name">${escHtml(t.name)}</div>
      <div class="tc-meta">
        ${t.priority ? renderPriorityDot(t.priority) : ''}
        ${deadline}
        ${t.assignee ? `<span style="font-size:8.5px;color:var(--gray-400)">${escHtml(t.assignee)}</span>` : ''}
      </div>
    </div>
  </div>`;
}

function renderListCard(l){
  return `<div class="list-card">
    <div class="list-card-title" onclick="renameList('${l.id}')">${l.emoji} ${escHtml(l.title)}</div>
    ${l.items.map(item=>`
      <div class="list-item">

          onblur="editListItem('${l.id}','${item.id}',this.textContent)">${escHtml(item.text)}</span>
      </div>`).join('')}
    <div class="li-add" onclick="addListItem('${l.id}')"><i class="ti ti-plus" style="font-size:10px"></i> Add item</div>
  </div>`;
}

function addList(){
  const l = {id:uid(), title:'New list', emoji:'📝', workspaceId:state.activeWs, items:[]};
  state.lists.push(l);
  save(); render();
  setTimeout(()=>{ const el = document.querySelector(`[onclick="renameList('${l.id}')"]`); if(el) el.click(); },100);
}

function renameList(id){
  const l = state.lists.find(x=>x.id===id); if(!l) return;
  const name = prompt('List name:', l.title); if(name===null) return;
  const em = prompt('Emoji:', l.emoji) || l.emoji;
  l.title = name; l.emoji = em; save(); render();
}

function addListItem(listId){
  const l = state.lists.find(x=>x.id===listId); if(!l) return;
  const text = prompt('New item:'); if(!text) return;
  l.items.push({id:uid(), text, done:false});
  save(); render();
}

function toggleListItem(listId, itemId){
  const l = state.lists.find(x=>x.id===listId); if(!l) return;
  const item = l.items.find(x=>x.id===itemId); if(!item) return;
  item.done = !item.done; save(); render();
}

function editListItem(listId, itemId, text){
  const l = state.lists.find(x=>x.id===listId); if(!l) return;
  const item = l.items.find(x=>x.id===itemId); if(!item) return;
  item.text = text.trim(); save();
}

// ─── TASK ACTIONS ─────────────────────────────────────────────────────────────
function toggleDone(e, id){
  e.stopPropagation();
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  if(t.status==='done'){ t.status='todo'; t.archivedOn=null; }
  else { t.status='done'; t.archivedOn=today(); }
  save(); render();
}

function deleteTask(id){
  state.tasks = state.tasks.filter(x=>x.id!==id);
  closeOverlay(); save(); render();
}

// ─── ADD TASK POPUP ───────────────────────────────────────────────────────────
function openAddTask(date, dirId){
  const dirOptions = state.directions.map(d=>`<option value="${d.id}" ${d.id===(dirId||state.directions[0].id)?'selected':''}>${d.emoji} ${d.name}</option>`).join('');
  const weekDates = getWeekDates(state.weekOffset);
  const dateOptions = weekDates.map(d=>`<option value="${d}" ${d===(date||today())?'selected':''}>${DAY_NAMES[dayOfWeek(d)]} ${fmt(d)}</option>`).join('');
  showOverlay(`<div class="quick-add" onclick="event.stopPropagation()">
    <div class="qa-title">New Task</div>
    <input class="qa-input" id="qa-name" placeholder="Task name..." autofocus>
    <div class="qa-row">
      <select class="qa-select" id="qa-dir">${dirOptions}</select>
      <select class="qa-select" id="qa-type">
        <option value="one-time">One-time</option>
        <option value="regular">Regular</option>
        <option value="urgent">Urgent</option>
      </select>
    </div>
    <div class="qa-row">
      <select class="qa-select" id="qa-priority">
        <option value="">No priority</option>
        <option value="high">🔴 High</option>
        <option value="medium">🟡 Medium</option>
        <option value="low">🟢 Low</option>
      </select>
      <select class="qa-select" id="qa-date">${dateOptions}</select>
    </div>
    <div class="qa-actions">
      <button class="btn-cancel" onclick="closeOverlay()">Cancel</button>
      <button class="btn-save" onclick="saveNewTask()">Add task</button>
    </div>
  </div>`);
  setTimeout(()=>document.getElementById('qa-name')?.focus(),50);
}

function saveNewTask(){
  const name = document.getElementById('qa-name')?.value?.trim();
  if(!name) return;
  const t = {
    id: uid(),
    name,
    directionId: document.getElementById('qa-dir')?.value || state.directions[0]?.id,
    priority: document.getElementById('qa-priority')?.value || null,
    type: document.getElementById('qa-type')?.value || 'one-time',
    status: 'todo',
    scheduledDate: document.getElementById('qa-date')?.value || today(),
    deadline: null,
    assignee: '',
    notes: '',
    emoji: '',
    archivedOn: null,
    recurDays: null,
    workspaceId: state.activeWs,
    createdAt: Date.now(),
  };
  state.tasks.push(t);
  save(); closeOverlay(); render();
}

// ─── TASK POPUP ───────────────────────────────────────────────────────────────
function openTaskPopup(id){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  const dir = dirById(t.directionId);
  const dirOptions = state.directions.map(d=>`<option value="${d.id}" ${d.id===t.directionId?'selected':''}>${d.emoji} ${d.name}</option>`).join('');
  const recurOptions = [
    {v:'',l:'No recurrence'},
    {v:'1',l:'Every Monday'},{v:'2',l:'Every Tuesday'},{v:'3',l:'Every Wednesday'},
    {v:'4',l:'Every Thursday'},{v:'5',l:'Every Friday'},{v:'6',l:'Every Saturday'},{v:'0',l:'Every Sunday'},
    {v:'1,4',l:'Mon & Thu'},{v:'1,3',l:'Mon & Wed'},{v:'2,5',l:'Tue & Fri'},
    {v:'1,2,3,4,5',l:'Weekdays'},{v:'0,6',l:'Weekends'},
  ].map(x=>`<option value="${x.v}" ${JSON.stringify(t.recurDays||[])===JSON.stringify(x.v.split(',').filter(Boolean).map(Number))?'selected':''}>${x.l}</option>`).join('');

  const coverStyle = t.coverImage ? `background:url(${t.coverImage}) center/cover no-repeat` : `background:linear-gradient(135deg,${dir.color}22,${dir.color}44)`;
  showOverlay(`<div class="popup" onclick="event.stopPropagation()">
    <div class="popup-cover" style="${coverStyle}" onclick="changeCover('${id}')">
      <span class="popup-cover-hint">Click to change cover</span>
      <div class="popup-close" onclick="closeOverlay()"><i class="ti ti-x"></i></div>
    </div>
    <div class="popup-body">
      <div class="popup-title-row">
        <button class="popup-emoji-btn" onclick="changeTaskEmoji('${id}')">${t.emoji||dir.emoji||'📌'}</button>
        <input class="popup-name-input" id="pt-name" value="${escAttr(t.name)}" placeholder="Task name...">
      </div>
      <div class="popup-props">
        <div class="prop-row">
          <div class="prop-label"><i class="ti ti-tag"></i> Direction</div>
          <div class="prop-val"><select id="pt-dir" style="background:${dir.color}18;color:${dir.color};border:none;outline:none;font-size:11px;font-weight:500;padding:2px 6px;border-radius:4px;cursor:pointer">${dirOptions}</select></div>
        </div>
        <div class="prop-row">
          <div class="prop-label"><i class="ti ti-circle-dot"></i> Priority</div>
          <div class="prop-val">
            <div class="priority-dots">
              <div class="p-dot p-dot-none ${!t.priority?'selected':''}" onclick="setTaskPriority('${id}',null)" title="None"></div>
              <div class="p-dot p-dot-high ${t.priority==='high'?'selected':''}" onclick="setTaskPriority('${id}','high')" title="High"></div>
              <div class="p-dot p-dot-med ${t.priority==='medium'?'selected':''}" onclick="setTaskPriority('${id}','medium')" title="Medium"></div>
              <div class="p-dot p-dot-low ${t.priority==='low'?'selected':''}" onclick="setTaskPriority('${id}','low')" title="Low"></div>
            </div>
          </div>
        </div>
        <div class="prop-row">
          <div class="prop-label"><i class="ti ti-repeat"></i> Recurrence</div>
          <div class="prop-val"><select id="pt-recur" class="prop-val">${recurOptions}</select></div>
        </div>
        <div class="prop-row">
          <div class="prop-label"><i class="ti ti-flag"></i> Type</div>
          <div class="prop-val">
            <select id="pt-type">
              <option value="one-time" ${t.type==='one-time'?'selected':''}>One-time</option>
              <option value="regular" ${t.type==='regular'?'selected':''}>Regular</option>
              <option value="urgent" ${t.type==='urgent'?'selected':''}>Urgent</option>
            </select>
          </div>
        </div>
        <div class="prop-row">
          <div class="prop-label"><i class="ti ti-calendar"></i> Scheduled</div>
          <div class="prop-val"><input type="date" id="pt-sched" value="${t.scheduledDate||''}"></div>
        </div>
        <div class="prop-row">
          <div class="prop-label"><i class="ti ti-calendar-due"></i> Deadline</div>
          <div class="prop-val"><input type="date" id="pt-deadline" value="${t.deadline||''}"></div>
        </div>
        <div class="prop-row">
          <div class="prop-label"><i class="ti ti-user"></i> Assignee</div>
          <div class="prop-val"><input type="text" id="pt-assignee" value="${escAttr(t.assignee||'')}" placeholder="Add name..."></div>
        </div>
      </div>
      <div class="popup-notes-label">Notes</div>
      <textarea class="popup-notes" id="pt-notes" placeholder="Add notes, links, context...">${escHtml(t.notes||'')}</textarea>
      <div class="popup-actions">
        <button class="btn-danger" onclick="deleteTask('${id}')"><i class="ti ti-trash" style="font-size:11px"></i> Delete</button>
        <button class="btn-save" onclick="saveTaskPopup('${id}')">Save</button>
      </div>
    </div>
  </div>`);
}

function saveTaskPopup(id){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  t.name = document.getElementById('pt-name')?.value?.trim() || t.name;
  t.directionId = document.getElementById('pt-dir')?.value || t.directionId;
  t.type = document.getElementById('pt-type')?.value || t.type;
  t.scheduledDate = document.getElementById('pt-sched')?.value || null;
  t.deadline = document.getElementById('pt-deadline')?.value || null;
  t.assignee = document.getElementById('pt-assignee')?.value?.trim() || '';
  t.notes = document.getElementById('pt-notes')?.value || '';
  const recurVal = document.getElementById('pt-recur')?.value;
  t.recurDays = recurVal ? recurVal.split(',').map(Number) : null;
  save(); closeOverlay(); render();
}

function setTaskPriority(id, priority){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  t.priority = priority;
  // update dots UI
  document.querySelectorAll('.p-dot').forEach(el=>el.classList.remove('selected'));
  event.target.classList.add('selected');
}

function changeCover(id){
  const url = prompt('Image URL (or leave empty to remove):');
  if(url===null) return;
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  t.coverImage = url || null;
}

function changeTaskEmoji(id){
  const em = prompt('Emoji:'); if(!em) return;
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  t.emoji = em; save();
  const btn = document.querySelector('.popup-emoji-btn');
  if(btn) btn.textContent = em;
}

// ─── REMINDERS ────────────────────────────────────────────────────────────────
function openReminders(){
  renderRemindersPanel();
}

function renderRemindersPanel(){
  const rems = state.reminders.sort((a,b)=>a.date.localeCompare(b.date));
  showOverlay(`<div class="rem-panel" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div style="font-size:14px;font-weight:500;color:var(--gray-900)">Reminders & Events</div>
      <div class="popup-close" onclick="closeOverlay()" style="position:relative;top:0;right:0;width:24px;height:24px"><i class="ti ti-x"></i></div>
    </div>
    <div class="rem-list">
      ${rems.length ? rems.map(r=>`
        <div class="rem-item">
          <span class="rem-item-emoji">${r.emoji||'📌'}</span>
          <span class="rem-item-text">${escHtml(r.text)}</span>
          <span class="rem-item-date">${fmt(r.date)}</span>
          <button class="rem-item-del" onclick="deleteReminder('${r.id}')"><i class="ti ti-x"></i></button>
        </div>`) .join('') : '<div style="font-size:12px;color:var(--gray-400);text-align:center;padding:16px">No reminders yet</div>'}
    </div>
    <div class="rem-add-form">
      <div style="font-size:11px;font-weight:500;color:var(--gray-700);margin-bottom:6px">Add reminder</div>
      <div class="rem-add-row">
        <input class="rem-input" style="width:48px" id="rem-emoji" placeholder="📌" value="">
        <input class="rem-input" id="rem-text" placeholder="Birthday, holiday, deadline...">
        <input class="rem-input" style="width:130px" id="rem-date" type="date" value="${today()}">
      </div>
      <div class="rem-add-row">
        <select class="qa-select" id="rem-type" style="flex:1">
          <option value="custom">Custom</option>
          <option value="bday">Birthday 🎂</option>
          <option value="holiday">Holiday 🗓️</option>
        </select>
        <button class="btn-save" onclick="addReminder()" style="padding:5px 14px">Add</button>
      </div>
      <div style="font-size:11px;font-weight:500;color:var(--gray-700);margin:10px 0 4px">Bulk import (one per line: YYYY-MM-DD text)</div>
      <textarea class="bulk-textarea" id="rem-bulk" placeholder="2026-06-01 Mum's birthday&#10;2026-06-28 Constitution Day"></textarea>
      <button class="btn-sm" onclick="importBulkReminders()" style="margin-top:6px;width:100%;justify-content:center"><i class="ti ti-upload" style="font-size:11px"></i> Import list</button>
    </div>
  </div>`);
}

function addReminder(){
  const emoji = document.getElementById('rem-emoji')?.value?.trim() || '📌';
  const text = document.getElementById('rem-text')?.value?.trim();
  const date = document.getElementById('rem-date')?.value;
  const type = document.getElementById('rem-type')?.value || 'custom';
  if(!text || !date) return;
  state.reminders.push({id:uid(), text, date, emoji, type});
  save(); renderRemindersPanel();
}

function deleteReminder(id){
  state.reminders = state.reminders.filter(r=>r.id!==id);
  save(); renderRemindersPanel();
}

function importBulkReminders(){
  const raw = document.getElementById('rem-bulk')?.value || '';
  const lines = raw.trim().split('\n').filter(Boolean);
  let added = 0;
  lines.forEach(line=>{
    const m = line.match(/^(\d{4}-\d{2}-\d{2})\s+(.+)$/);
    if(m){
      const [,date,text] = m;
      const emoji = text.match(/\p{Emoji}/u)?.[0] || '📌';
      const type = text.toLowerCase().includes('birthday') ? 'bday' : text.toLowerCase().includes('day')?'holiday':'custom';
      state.reminders.push({id:uid(), text:text.trim(), date, emoji, type});
      added++;
    }
  });
  if(added){ save(); alert(`Added ${added} reminders`); renderRemindersPanel(); }
  else alert('No valid lines found. Format: YYYY-MM-DD Event name');
}

// ─── DIRECTIONS SETTINGS ──────────────────────────────────────────────────────
const PALETTE = ['#3B82F6','#22C55E','#F97316','#A855F7','#EC4899','#EAB308','#EF4444','#0EA5E9','#6B7280','#14B8A6','#8B5CF6','#F43F5E','#10B981','#F59E0B','#6366F1'];

function openDirections(){
  showOverlay(`<div class="dir-settings" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div style="font-size:14px;font-weight:500;color:var(--gray-900)">Directions & Colors</div>
      <div class="popup-close" onclick="closeOverlay()" style="position:relative;top:0;right:0;width:24px;height:24px"><i class="ti ti-x"></i></div>
    </div>
    <div id="dir-list">${renderDirList()}</div>
    <button class="btn-sm" onclick="addDirection()" style="margin-top:8px;width:100%;justify-content:center"><i class="ti ti-plus" style="font-size:11px"></i> Add direction</button>
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--gray-200)">
      <button class="btn-save" onclick="saveDirections()" style="width:100%;justify-content:center;display:flex">Save & Close</button>
    </div>
  </div>`);
}

function renderDirList(){
  return state.directions.map(d=>`
    <div class="dir-item" id="dir-${d.id}">
      <div class="dir-color-btn" style="background:${d.color}" onclick="pickColor('${d.id}')" title="Change color"></div>
      <button class="dir-emoji-btn" onclick="pickDirEmoji('${d.id}')">${d.emoji}</button>
      <input class="dir-name-input" value="${escAttr(d.name)}" id="dn-${d.id}" placeholder="Direction name">
      <button class="dir-del-btn" onclick="deleteDir('${d.id}')"><i class="ti ti-trash"></i></button>
    </div>`).join('');
}

function pickColor(dirId){
  const d = state.directions.find(x=>x.id===dirId); if(!d) return;
  const swatches = PALETTE.map(c=>`<div class="color-swatch ${d.color===c?'sel':''}" style="background:${c}" onclick="setDirColor('${dirId}','${c}',this)"></div>`).join('');
  const el = document.getElementById(`dir-${dirId}`);
  const existing = el.querySelector('.color-picker-row');
  if(existing){ existing.remove(); return; }
  const row = document.createElement('div');
  row.className = 'color-picker-row';
  row.style.cssText = 'width:100%;padding-top:6px;display:flex;gap:6px;flex-wrap:wrap';
  row.innerHTML = swatches;
  el.after(row);
}

function setDirColor(dirId, color, swatch){
  const d = state.directions.find(x=>x.id===dirId); if(!d) return;
  d.color = color;
  document.querySelector(`#dir-${dirId} .dir-color-btn`).style.background = color;
  document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('sel'));
  swatch.classList.add('sel');
}

function pickDirEmoji(dirId){
  const em = prompt('Emoji:'); if(!em) return;
  const d = state.directions.find(x=>x.id===dirId); if(!d) return;
  d.emoji = em;
  document.querySelector(`#dir-${dirId} .dir-emoji-btn`).textContent = em;
}

function addDirection(){
  const d = {id:uid(), name:'New direction', color:'#6366F1', emoji:'📁', category:'work'};
  state.directions.push(d);
  document.getElementById('dir-list').innerHTML = renderDirList();
}

function deleteDir(id){
  if(state.tasks.some(t=>t.directionId===id) && !confirm('This direction has tasks. Delete anyway?')) return;
  state.directions = state.directions.filter(d=>d.id!==id);
  document.getElementById('dir-list').innerHTML = renderDirList();
}

function saveDirections(){
  state.directions.forEach(d=>{
    const inp = document.getElementById(`dn-${d.id}`);
    if(inp) d.name = inp.value.trim() || d.name;
  });
  save(); closeOverlay(); render();
}

// ─── WORKSPACE ────────────────────────────────────────────────────────────────
function addWorkspace(){
  const name = prompt('Workspace name:'); if(!name) return;
  const emoji = prompt('Emoji:', '📁') || '📁';
  const ws = {id:uid(), name, emoji};
  state.workspaces.push(ws);
  state.activeWs = ws.id;
  save(); render();
}

function setWorkspace(id){ state.activeWs=id; save(); render(); }
function renameWs(name){ const ws=state.workspaces.find(w=>w.id===state.activeWs); if(ws){ws.name=name.trim()||ws.name; save();} }
function changeWsEmoji(){ const em=prompt('Emoji:'); if(!em) return; const ws=state.workspaces.find(w=>w.id===state.activeWs); if(ws){ws.emoji=em; save(); render();} }

// ─── TABS & NAVIGATION ────────────────────────────────────────────────────────
function setTab(tab){ state.activeTab=tab; save(); render(); }
function changeWeek(n){ if(n===0) state.weekOffset=0; else state.weekOffset+=n; fetchWeather(); render(); }

// ─── OVERLAY ──────────────────────────────────────────────────────────────────
function showOverlay(html){
  document.getElementById('overlay-content').innerHTML = html;
  document.getElementById('overlay').classList.remove('hidden');
}
function closeOverlay(e){
  if(e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.add('hidden');
}

// ─── ESCAPE ───────────────────────────────────────────────────────────────────
function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ─── KEYBOARD ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeOverlay({target:document.getElementById('overlay')});
  if((e.metaKey||e.ctrlKey) && e.key==='Enter'){
    const saveBtn = document.querySelector('.btn-save');
    if(saveBtn) saveBtn.click();
  }
});

// ─── MAIN RENDER ──────────────────────────────────────────────────────────────
function render(){
  renderSidebar();
  renderTabs();
  document.getElementById('sidebar').className = 'sb' + (state.sidebarOpen?'':' closed');
  switch(state.activeTab){
    case 'weekly':  renderWeekly(); break;
    case 'today':   renderToday(); break;
    case 'board':   renderBoard(); break;
    case 'backlog': renderBacklog(); break;
    case 'archive': renderArchive(); break;
  }
}

// ─── TOGGLE SIDEBAR ───────────────────────────────────────────────────────────
document.getElementById('toggle-sb-btn').addEventListener('click', ()=>{
  state.sidebarOpen = !state.sidebarOpen;
  document.getElementById('sidebar').className = 'sb' + (state.sidebarOpen?'':' closed');
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
load();
cleanupArchive();
autoRollover();
render();
fetchWeather();
</script>
</body>
</html>
